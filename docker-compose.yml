services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: abenix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abenix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abenix}
      POSTGRES_DB: ${POSTGRES_DB:-abenix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abenix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: abenix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: abenix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@abenix.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # Only needed for STORAGE_BACKEND=s3
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles:
      - s3
    container_name: abenix-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-abenix}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-abenix123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: abenix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 abenix abenix123;
      mc mb local/abenix-uploads --ignore-existing;
      mc mb local/abenix-exports --ignore-existing;
      echo 'Buckets created';
      "
    profiles:
      - init
      - s3

  # NATS JetStream — default transport for per-request agent execution.
  # Same server the AKS chart deploys, so dev/prod parity is 1:1.
  # Celery + Redis (above) stay for batch jobs (KB ingest, scheduled
  # triggers, code-runner builds) — they don't go through NATS.
  nats:
    image: nats:2.10-alpine
    container_name: abenix-nats
    command: ["-c", "/etc/nats/nats.conf", "-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./scripts/nats-local.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mosquitto — MQTT broker for the streaming/event-trigger primitive.
  # Anonymous + open by default to keep dev-local single-command. Prod
  # swaps in EMQX / AWS IoT Core / Azure IoT Hub via the helm values.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: abenix-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: >
      sh -c "printf 'listener 1883 0.0.0.0\nallow_anonymous true\npersistence true\npersistence_location /mosquitto/data/\nlog_dest stdout\n' > /mosquitto/config/mosquitto.conf
      && exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 2 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB — time-series store for the tsdb_query tool. Bound to
  # 5433 so it doesn't collide with the existing abenix-postgres on 5432.
  # Same SQL surface as Postgres + hypertable extension.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: abenix-timescaledb
    environment:
      POSTGRES_USER: ${TSDB_USER:-abenix}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-abenix}
      POSTGRES_DB: ${TSDB_DB:-abenix_tsdb}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abenix -d abenix_tsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python edge runtime, the reference, about 290 MB. Bring it up with
  # EDGE_AUTH_TOKEN and SIGNING_PUBKEY_PEM set and docker compose --profile edge-python up.
  edge-runtime:
    build:
      context: ./apps/edge-runtime
      dockerfile: Dockerfile
    image: abenix/edge-runtime:local
    container_name: abenix-edge
    environment:
      GATEWAY_ID: ${EDGE_GATEWAY_ID:-edge-local-python}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME:-edge-local-python}
      EDGE_AUTH_TOKEN: ${EDGE_AUTH_TOKEN:-}
      EDGE_ALLOW_NO_AUTH: ${EDGE_ALLOW_NO_AUTH:-}
      SIGNING_PUBKEY_PEM: ${SIGNING_PUBKEY_PEM:-}
      EDGE_ALLOW_UNSIGNED: ${EDGE_ALLOW_UNSIGNED:-}
      TENANT_ID: ${TENANT_ID:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      PLATFORM_URL: ${PLATFORM_URL:-http://host.docker.internal:8000}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-}
      MQTT_URL: mqtt://mosquitto:1883
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8088:8080"
    depends_on:
      mosquitto:
        condition: service_started
    profiles:
      - edge-python

  # Rust edge runtime, behind a profile so dev-local needs no Rust toolchain. About 85 MB. Bring it up with
  # EDGE_AUTH_TOKEN and SIGNING_PUBKEY_PEM set and docker compose --profile edge-rust up.
  edge-runtime-rust:
    build:
      context: ./apps/edge-runtime-rust
      dockerfile: Dockerfile
    image: abenix/edge-runtime-rust:local
    container_name: abenix-edge-rust
    environment:
      GATEWAY_ID: ${EDGE_GATEWAY_ID:-edge-local-rust}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME:-edge-local-rust}
      EDGE_AUTH_TOKEN: ${EDGE_AUTH_TOKEN:-}
      EDGE_ALLOW_NO_AUTH: ${EDGE_ALLOW_NO_AUTH:-}
      SIGNING_PUBKEY_PEM: ${SIGNING_PUBKEY_PEM:-}
      EDGE_ALLOW_UNSIGNED: ${EDGE_ALLOW_UNSIGNED:-}
      TENANT_ID: ${TENANT_ID:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      PLATFORM_URL: ${PLATFORM_URL:-http://host.docker.internal:8000}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-}
      MQTT_URL: mqtt://mosquitto:1883
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RUST_LOG: info
    ports:
      - "8089:8080"
    depends_on:
      mosquitto:
        condition: service_started
    profiles:
      - edge-rust

  # C edge runtime, about 95 MB with python3 in the image. Bring it up with
  # EDGE_AUTH_TOKEN and SIGNING_PUBKEY_PEM set and docker compose --profile edge-c up.
  edge-runtime-c:
    build:
      context: ./apps/edge-runtime-c
      dockerfile: Dockerfile
    image: abenix/edge-runtime-c:local
    container_name: abenix-edge-c
    environment:
      GATEWAY_ID: ${EDGE_GATEWAY_ID:-edge-local-c}
      GATEWAY_NAME: ${EDGE_GATEWAY_NAME:-edge-local-c}
      EDGE_AUTH_TOKEN: ${EDGE_AUTH_TOKEN:-}
      EDGE_ALLOW_NO_AUTH: ${EDGE_ALLOW_NO_AUTH:-}
      SIGNING_PUBKEY_PEM: ${SIGNING_PUBKEY_PEM:-}
      EDGE_ALLOW_UNSIGNED: ${EDGE_ALLOW_UNSIGNED:-}
      TENANT_ID: ${TENANT_ID:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      PLATFORM_URL: ${PLATFORM_URL:-http://host.docker.internal:8000}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-}
      MQTT_URL: mqtt://mosquitto:1883
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8080"
    ports:
      - "8090:8080"
    depends_on:
      mosquitto:
        condition: service_started
    profiles:
      - edge-c

  neo4j:
    image: neo4j:5-community
    container_name: abenix-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-abenix-neo4j-pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-abenix-neo4j-pass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  minio_data:
  neo4j_data:
  neo4j_logs:
  nats_data:
  mosquitto_data:
  mosquitto_log:
  timescaledb_data:
