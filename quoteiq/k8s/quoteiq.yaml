# QuoteIQ — Kubernetes manifests (standalone application).
#
# Deploys QuoteIQ API (port 8008) and Web (port 3008) into the same
# namespace as Abenix, so the API reaches abenix-api and Postgres through
# cluster DNS. The RFQ pipeline, its agents and the ERP code asset are seeded
# into the platform by the Abenix deploy; this only runs the app.

---
apiVersion: v1
kind: Secret
metadata:
  name: quoteiq-secrets
  namespace: abenix
type: Opaque
stringData:
  # Kept or minted at deploy time (deploy.sh, deploy-azure.sh,
  # seed-standalone-keys.sh). Needs the can_delegate scope.
  QUOTEIQ_ABENIX_API_KEY: "REPLACE_AT_DEPLOY_TIME"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quoteiq-config
  namespace: abenix
data:
  ABENIX_API_URL: "http://abenix-api:8000"
  # Where the browser reaches Abenix, for the links to runs and approvals.
  # deploy-azure.sh sets it to the ingress host.
  ABENIX_WEB_URL: "http://localhost:3000"
  # The inbox is kept in the qq_emails table, so it survives a restart.
  DATABASE_URL: "postgresql+asyncpg://postgres:localpass@abenix-postgresql:5432/abenix"
  PORT: "8008"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoteiq-api
  namespace: abenix
  labels:
    app: quoteiq-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quoteiq-api
  template:
    metadata:
      labels:
        app: quoteiq-api
    spec:
      containers:
        - name: api
          image: localhost:5000/abenix/quoteiq-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
              name: http
          envFrom:
            - secretRef:
                name: quoteiq-secrets
            - configMapRef:
                name: quoteiq-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: quoteiq-api
  namespace: abenix
spec:
  type: ClusterIP
  selector:
    app: quoteiq-api
  ports:
    - name: http
      port: 8008
      targetPort: 8008

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoteiq-web
  namespace: abenix
  labels:
    app: quoteiq-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quoteiq-web
  template:
    metadata:
      labels:
        app: quoteiq-web
    spec:
      containers:
        - name: web
          image: localhost:5000/abenix/quoteiq-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
              name: http
          env:
            # next.config.js rewrite target — the browser hits /api/qq/*,
            # the server proxies to the cluster-internal quoteiq-api.
            # It is read at build time; the image is built with this value.
            - name: QUOTEIQ_API_INTERNAL_URL
              value: "http://quoteiq-api:8008"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /
              port: 3008
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3008
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: quoteiq-web
  namespace: abenix
spec:
  type: NodePort
  selector:
    app: quoteiq-web
  ports:
    - name: http
      port: 3008
      targetPort: 3008
      nodePort: 30308
