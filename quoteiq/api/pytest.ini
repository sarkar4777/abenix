[pytest]
# QuoteIQ API test config. pytest-asyncio in auto mode, as in the other apps.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . sdk
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
