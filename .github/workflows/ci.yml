name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started from the Actions tab. Without it the only way to
  # check CI on a freshly created repository is to push a commit you did not
  # otherwise need, which desyncs the public mirror from the private source.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==24.8.0 ruff==0.6.9
      - name: Black (formatter check)
        run: black --check apps/api apps/agent-runtime apps/worker packages/db
      - name: Ruff (linter)
        run: ruff check apps/api apps/agent-runtime apps/worker packages/db
      # pip-audit on the API requirements. Failing CVEs MUST block.
      # Whitelisted advisories live in .pip-audit-ignore so an
      # unreviewed CVE never silently slips through.
      - run: pip install pip-audit
      - name: pip-audit
        run: |
          IGNORE_ARGS=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | tr -d '[:space:]')"
              [ -n "$line" ] && IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $line"
            done < .pip-audit-ignore
          fi
          pip-audit -r apps/api/requirements.txt $IGNORE_ARGS

  python-test:
    needs: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          # Test runner + things the unit suite uses directly.
          pip install pytest pytest-asyncio
          # The new unit tests import worker.tasks.document_processor and
          # engine.agent_executor / engine.knowledge.hybrid_search at module
          # scope. Both modules pull deep transitive chains (celery, anthropic,
          # openai, google-genai, neo4j, langchain_text_splitters, PyPDF2, …).
          # Rather than whack-a-mole one missing package at a time, install
          # the requirement files for the three apps the tests import from.
          # This is the canonical list — same one production runs against —
          # and keeps CI in lockstep with the prod surface.
          pip install -r apps/api/requirements.txt \
                      -r apps/agent-runtime/requirements.txt \
                      -r apps/worker/requirements.txt
      - run: pytest tests/unit/ -v --tb=short
      # Validates every agent seed, and checks that an agent declaring
      # knowledge_search has a collection granted somewhere. Nothing ran this
      # before, which is how twenty-three agents came to advertise a tool the
      # runtime then declined to give them.
      - run: python scripts/lint-agent-seeds.py
      # The README is the public repo's front page, and a screenshot that is on
      # disk but untracked renders as a broken image there while looking fine
      # locally.
      - run: python scripts/check-readme-images.py
      # CI builds apps/*/Dockerfile but the cluster builds docker/Dockerfile.*,
      # so the CVE patches went to one set and the images actually serving
      # traffic kept every finding. Nothing compared them until this ran.
      - run: python scripts/check-dockerfile-hardening.py

  web-lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_STRICT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pin npm to packageManager version
        run: npm install -g npm@10.8.2
      - run: npm ci --include=optional
      - name: Ensure Next.js linux SWC binary is present
        run: npm install --no-save --workspace=@abenix/web @next/swc-linux-x64-gnu
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck (web)
        run: |
          cd apps/web && npx tsc --noEmit
      - name: Next build (web)
        run: |
          cd apps/web && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          COREPACK_ENABLE_STRICT: "0"
      # The vitest suites ran in no gate at all, so a test asserting behaviour
      # apiFetch has never had sat broken and nothing said so. They are quick.
      - name: Unit tests (vitest)
        run: npm test

  e2e-smoke:
    needs: [python-lint, python-test, web-lint-typecheck-build]
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_STRICT: "0"
    # Quick browser-driven smoke against a docker-compose stack. Runs
    # only the headline UAT files to keep CI under 8 min while still
    # catching regressions in real user flows.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install -g npm@10.8.2
      - run: npm ci --include=optional
      - name: Boot stack (postgres + redis only — API + web run locally)
        run: docker compose up -d postgres redis
      - name: Wait for db ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U abenix; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready" && exit 1
      # NOTE: API + web boot is intentionally NOT in CI yet — full local
      # boot needs ANTHROPIC_API_KEY and a populated tenant. The
      # web-build job above already catches typecheck + bundle errors,
      # and tests/unit covers the API primitives.
      - name: Playwright install (browsers only)
        run: npx playwright install --with-deps chromium
      - run: docker compose down -v
        if: always()

  build-images:
    needs: [python-lint, python-test, web-lint-typecheck-build]
    # A manual run counts too. Without workflow_dispatch here, the one job
    # that publishes images is the one job you cannot exercise on demand, so
    # a registry or permissions problem only ever shows up on a real push.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            file: apps/web/Dockerfile
          - name: api
            file: apps/api/Dockerfile
          - name: agent-runtime
            file: apps/agent-runtime/Dockerfile
          - name: worker
            file: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'
      - name: Trivy SARIF upload
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service.name }}.sarif'
        continue-on-error: true
