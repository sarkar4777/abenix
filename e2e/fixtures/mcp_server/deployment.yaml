apiVersion: apps/v1
kind: Deployment
metadata:
  name: uat-mcp
  namespace: abenix
  labels:
    app: uat-mcp
    purpose: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uat-mcp
  template:
    metadata:
      labels:
        app: uat-mcp
    spec:
      containers:
        - name: server
          # Public-repo placeholder. publish-public.sh scrubs every real
          # ACR name out of the source tree, so this image ref must stay
          # generic. Before `kubectl apply`, substitute your real ACR —
          # e.g. envsubst or:
          #   sed -i "s|your-acr.azurecr.io|${ACR_NAME}.azurecr.io|g" \
          #     e2e/fixtures/mcp_server/deployment.yaml
          # or build+push under any tag and override with:
          #   kubectl set image deploy/uat-mcp -n abenix \
          #     server=<your-acr>.azurecr.io/uat-mcp:latest
          image: your-acr.azurecr.io/uat-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: uat-mcp
  namespace: abenix
  labels:
    app: uat-mcp
spec:
  selector:
    app: uat-mcp
  ports:
    - port: 8080
      targetPort: 8080
      name: http
