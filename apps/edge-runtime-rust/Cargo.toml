[package]
name = "edge-runtime-rust"
version = "1.1.0"
edition = "2021"
description = "AgentForge edge runtime — Rust port"
license = "Proprietary"
publish = false

[lib]
name = "edge_runtime_rust"
path = "src/lib.rs"

[[bin]]
name = "edge-runtime"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
signature = "2"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
bytes = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
