[project]
name = "abenix-worker"
version = "0.1.0"
description = "Abenix async task workers"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "langchain-text-splitters>=0.2.0",
    "openai>=1.30.0",
    "pinecone>=5.0.0",
    # pypdf, not PyPDF2. Every `from pypdf import PdfReader` in this tree was
    # migrated already, but the declaration was left behind, so the image kept
    # installing the abandoned package and carrying CVE-2023-36464 with it.
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Cognify writes the graph from this image
    "neo4j>=5.20.0",
    # scanned PDFs and images, see engine/knowledge/extractors/ocr.py
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.3.0",
    # office formats. The pdf extra is left out on purpose, it brings torch.
    "unstructured[docx,pptx,xlsx,md,epub,rtf,odt]>=0.15.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.0",
    "olefile>=0.47",
    "boto3>=1.34.0",
    "azure-storage-blob>=12.20.0",
    # SQL connector, the Postgres driver is above and others install their own
    "PyMySQL>=1.1.0",
    # Transitive via CacheControl, floored for GHSA-6v7p-g79w-8964. Safe to
    # move because we take celery[redis], so kombu's msgpack==1.1.2 pin (which
    # only applies under its msgpack extra) is not in play.
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
