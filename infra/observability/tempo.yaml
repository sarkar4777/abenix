---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abenix-tempo-config
  namespace: abenix
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s
    compactor:
      compaction:
        block_retention: 168h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abenix-tempo
  namespace: abenix
  labels: { app: abenix-tempo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: abenix-tempo }
  template:
    metadata:
      labels: { app: abenix-tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http,      containerPort: 3200 }
            - { name: grpc,      containerPort: 9095 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: config,  mountPath: /etc/tempo }
            - { name: storage, mountPath: /var/tempo }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: abenix-tempo-config }
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: abenix-tempo
  namespace: abenix
spec:
  type: ClusterIP
  selector: { app: abenix-tempo }
  ports:
    - { name: http,      port: 3200, targetPort: 3200 }
    - { name: grpc,      port: 9095, targetPort: 9095 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
