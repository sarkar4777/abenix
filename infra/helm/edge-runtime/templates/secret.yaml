{{- $name := printf "%s-secret" (include "edge-runtime.fullname" .) -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $auth := .Values.auth_token -}}
{{- if not $auth -}}
{{- if and $old $old.data (index $old.data "auth_token") -}}
{{- $auth = index $old.data "auth_token" | b64dec -}}
{{- else -}}
{{- $auth = randAlphaNum 40 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "edge-runtime.labels" . | nindent 4 }}
type: Opaque
stringData:
  platform_token: {{ .Values.platform_token | quote }}
  anthropic_api_key: {{ .Values.anthropic_api_key | quote }}
  anthropic_auth_token: {{ .Values.anthropic_auth_token | quote }}
  auth_token: {{ $auth | quote }}
  enroll_token: {{ .Values.enroll_token | quote }}
  collectors.json: {{ .Values.collectors | toJson | quote }}
  signing_pubkey: |-
    {{- .Values.signing_pubkey | nindent 4 }}
