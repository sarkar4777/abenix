web:
  replicaCount: 2
  image:
    repository: ghcr.io/abenix/web
    tag: latest
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 3
  image:
    repository: ghcr.io/abenix/api
    tag: latest
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  envFrom:
    - secretRef:
        name: abenix-secrets
    - configMapRef:
        name: abenix-config

agent-runtime:
  replicaCount: 3
  image:
    repository: ghcr.io/abenix/agent-runtime
    tag: latest
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  envFrom:
    - secretRef:
        name: abenix-secrets
    - configMapRef:
        name: abenix-config

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/abenix/worker
    tag: latest
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  envFrom:
    - secretRef:
        name: abenix-secrets
    - configMapRef:
        name: abenix-config

postgresql:
  architecture: replication
  # Custom image: bitnamilegacy/postgresql:16.4.0-debian-12-r14 with the
  # pgvector extension layered in. Built from infra/docker/
  # Dockerfile.postgres-pgvector. Lets KB collections use
  # vector_backend='pgvector' instead of falling back to Pinecone.
  image:
    registry: your-acr.azurecr.io
    repository: postgresql-pgvector
    tag: "16"
  auth:
    existingSecret: abenix-secrets
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    # Bitnami's default ServiceAccount has no imagePullSecrets — make
    # sure the ACR pull secret is attached on every pod.
    serviceAccount:
      imagePullSecrets:
        - name: acr-pull-secret
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      size: 50Gi
      storageClass: managed-premium
  readReplicas:
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      size: 50Gi
      storageClass: managed-premium
  pgpool:
    enabled: true
    replicaCount: 1
    maxPool: 20
    numInitChildren: 100
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  architecture: standalone
  auth:
    existingSecret: abenix-secrets
    existingSecretPasswordKey: redis-password
  master:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 4Gi
    persistence:
      size: 10Gi
      storageClass: managed-premium

neo4j:
  image:
    repository: neo4j
    tag: "5.20.0"
    pullPolicy: IfNotPresent
  database: neo4j
  auth:
    username: neo4j
    existingSecret: abenix-secrets
    existingSecretPasswordKey: neo4j-password
  plugins:
    - apoc
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  jvm:
    heap:
      initial: 512m
      max: 1g
    pagecache: 512m
  replicaCount: 1

cognifyWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/abenix/worker
    tag: latest
    pullPolicy: IfNotPresent
  queue: cognify
  concurrency: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

pinecone:
  indexName: abenix

objectStorage:
  type: local
  uploadDir: /data/uploads
  exportDir: /data/exports
  # ML model files (sklearn/pytorch/onnx/xgboost/tf) live on the shared
  # /data mount so multi-replica serving + the Cognify worker can read
  # what the API uploaded.
  mlModelsDir: /data/ml-models
  # Code Runner asset zips (one folder per registered repo) + the
  # binary/build cache (sha256-keyed compiled artifacts so Go/Java/Rust
  # don't re-build every invocation).
  codeAssetStore: /data/code-assets
  codeAssetBuildCache: /data/code-asset-cache
  bucket: ""
  region: ""
  container: ""

# Shared workspace storage. On minikube the default `hostPath` works
# because all pods land on the same node. For multi-node k8s flip
# `usePVC: true` and set `storageClass` to a ReadWriteMany class
# (NFS, EFS-CSI, Azure Files, cephfs). The application code is identical
# in both modes — only the volume source changes.
sharedData:
  usePVC: false
  storageClass: ""
  storageSize: "20Gi"

# Execution archives. Dumps go to the objectStorage backend above under
# archives/<tenant>/<run>.jsonl.gz. In local mode they land on /data/archives,
# which is pod-local unless this PVC is on. Mounting it also needs
# api.archivesPVC.enabled so the api subchart picks the claim up.
archives:
  pvc:
    enabled: false
    claimName: abenix-archives
    storageClass: ""
    accessMode: ReadWriteOnce
    storageSize: 10Gi

meeting:
  # LiveKit connection for the Meeting Representative agent. Set these in
  # the tenant's secret or override per-environment via `helm --set`.
  livekit:
    url: ""
    apiKey: ""
    apiSecret: ""
    meetUrl: "https://meet.livekit.io"
  # OpenAI TTS voice for the bot speaking into the meeting
  ttsVoice: "alloy"
  # Optional: webhook URL the defer_to_human tool pings when the bot
  # pushes a question back to the user.
  deferNotifyWebhookUrl: ""

sandboxedJob:
  # The sandboxed_job tool runs one-shot commands in isolated containers
  # (kubernetes Job in cluster, docker on host). Always on by default —
  # disable per-environment by setting `enabled: "false"`.
  enabled: "true"
  # Comma-separated allow-list. Only listed images can be launched.
  allowedImages: "alpine:3.20,busybox:1.36,python:3.12-slim,gcc:13,golang:1.22-alpine,rust:1.80-slim,eclipse-temurin:21-jdk,node:20-alpine,sbtscala/scala-sbt:eclipse-temurin-jammy-21.0.2_13_1.10.0_3.4.2,zenika/kotlin:1.9.24-jdk-jre-alpine-slim,mcr.microsoft.com/dotnet/sdk:8.0,ruby:3.3-alpine"
  # Optional: target namespace for k8s Jobs (defaults to the API pod's own
  # namespace). The default ServiceAccount needs Role + RoleBinding granting
  # batch/jobs + pods CRUD in that namespace.
  namespace: ""

databaseName: abenix
frontendUrl: "http://localhost:3000"

# v1.1 streaming/TSDB infra. deploy.sh installs these as separate helm
# releases named <release>-mosquitto and <release>-timescaledb; override the
# hosts only if you point at a broker or Timescale outside the cluster.
streaming:
  mqttHost: ""
  tsdbHost: ""
  tsdbUser: abenix
  tsdbPassword: abenix
  tsdbDatabase: abenix_tsdb

# Browser origins the API accepts. Override per overlay whenever the UI is
# served on a different host or port.
corsOrigins:
  - "http://localhost:3000"

# Execution posture. "embedded" runs agents inside the API pod, "remote"
# dispatches to the agent-runtime pods (needs scaling.enabled below).
runtimeMode: embedded

# Host path backing the shared /data mount on single-node clusters.
sharedDataHostPath: /var/lib/abenix/data

# Shared volume for uploaded ML model files. Disabled in the base chart so a
# plain install does not demand a PVC; the local and Azure overlays enable it.
mlModels:
  enabled: false
  storageClass:
  accessMode: ReadWriteOnce
  storageSize: 5Gi
  mountPath: /data/ml-models
  servingImage: ""

# NATS JetStream, used when scaling.queueBackend is "nats". Off by default so
# the base chart installs without it.
nats:
  enabled: false
  cluster:
    enabled: false
    replicas: 1
  jetstream:
    enabled: false
    fileStorage:
      size: 1Gi

# Wave-2 scaling. The chart's templates all read .Values.scaling.*, so this
# block has to exist even when scaling is off — without it a plain
# `helm install ./infra/helm/abenix` failed on a nil pointer in
# scaling-alerts.yaml before rendering anything. Off by default so the base
# chart installs the simple embedded posture; values-local.yaml and
# values-azure.yaml switch it on.
scaling:
  enabled: false
  execRemote: false
  queueBackend: celery
  agentRuntimeImage: {}
  keda:
    enabled: false
  alerts:
    # PrometheusRule CRD is not present on a vanilla cluster.
    enabled: false
  pools: []

# Platform alert delivery. Prometheus rules fire into the chart's
# Alertmanager, which posts to the API webhook. The API fans each alert
# out to tenant admins (in-app + WS) and Slack (per-tenant webhook or
# ABENIX_SLACK_WEBHOOK_URL). The token the webhook checks is
# secrets.alertWebhookToken (auto-generated when empty).
alerting:
  prometheusUrl: ""  # empty = http://<release>-prometheus.<ns>.svc.cluster.local:9090
  alertmanagerUrl: ""  # empty = http://<release>-alertmanager.<ns>.svc.cluster.local:9093
  alertmanager:
    enabled: true
    image: prom/alertmanager:v0.27.0
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }
  # Optional second receiver: Alertmanager posts straight to this Slack hook.
  slackWebhookUrl: ""
  slackChannel: ""
  repeatInterval: 4h
  resolveTimeout: 5m
  # Re-notify the same alert fingerprint at most once per window.
  dedupeMinutes: 30
  platformAlerts:
    enabled: true

# Progress pub/sub namespacing — overridden per tenant/app deployment.
# Defaults are generic ("progress:", "parent:") so the engine doesn't
# carry any app-name baggage. Override e.g. to "wingman:progress:" or
# "contractiq:progress:" in the corresponding values overlay.
progress:
  channelPrefix: "progress:"
  parentKeyPrefix: "parent:"
  parentTtl: "1800"

# Comma-separated list of import paths the agent-runtime loads at
# startup so per-app deterministic guardrails register themselves with
# engine.post_processors. Empty by default — apps that want guardrails
# override in their own values file. Example for contractiq:
#   postProcessorModules: "contractiq.runtime.post_processors"
postProcessorModules: ""

# MCP server URL allow-list (comma-separated host suffixes). When empty
# the configmap falls back to "uat-mcp.<release-namespace>.svc.cluster.local"
# so the canonical UAT MCP fixture can be registered. Override to a
# comma-separated list of any in-cluster MCP services you want callable
# (e.g. "uat-mcp.abenix.svc.cluster.local,other-mcp.tools.svc.cluster.local").
mcpAllowedHosts: ""

environment: production
logLevel: info

secrets:
  databaseUrl: ""
  redisUrl: ""
  redisPassword: ""
  postgresPassword: ""
  jwtSecret: ""
  stripeSecretKey: ""
  anthropicApiKey: ""
  # Claude Pro/Max subscription token (`claude setup-token`). Optional.
  claudeSubscriptionToken: ""
  # Alertmanager -> API webhook bearer token. Empty = generated once per install.
  alertWebhookToken: ""
  neo4jPassword: ""
  openaiApiKey: ""
  pineconeApiKey: ""
  googleApiKey: ""
  azureOpenaiApiKey: ""
  azureOpenaiApiBase: ""
  azureOpenaiApiVersion: "2024-10-01-preview"
  # Cluster KEK, `openssl rand -base64 32`. Encrypts tool credentials saved from
  # the admin screen and persona memory. Keep it stable, a changed KEK makes
  # stored values unreadable and they have to be entered again.
  dataKeyKekBase64: ""
  # Edge bundle signing. RSA-2048 private key PEM the API signs .agent bundles
  # with, required outside dev. Deploy scripts pass it with --set-file from
  # EDGE_SIGNING_KEY_FILE. The pubkey is informational on the API, gateways
  # fetch it from GET /api/edge/signing-key.
  edgeSigningKeyPem: ""
  edgeSigningPubkeyPem: ""

# Edge gateway signing policy. allowUnsigned lets a gateway load bundles with
# no signature, local development only, never true on a shared cluster.
edge:
  allowUnsigned: false

# Azure OpenAI embedding deployment name. Worker + agent-runtime prefer
# Azure when AZURE_OPENAI_API_KEY + endpoint are set; the direct OpenAI
# path is only used when Azure isn't configured. Matches the deployment
# created in the customer's Azure OpenAI resource — defaults to the model
# name itself since most teams name the deployment the same.
azureEmbeddingDeployment: "text-embedding-3-small"

ingress:
  enabled: true
  className: nginx
  host: app.abenix.io
  tls:
    enabled: true
    secretName: abenix-tls

networkPolicy:
  enabled: false

backup:
  enabled: false
  schedule: "0 2 * * *"
  image: postgres:16-alpine
  s3Bucket: ""
  persistentVolume:
    enabled: false
  neo4j:
    enabled: false
    schedule: "0 3 * * *"

monitoring:
  enabled: false
  scrapeInterval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
