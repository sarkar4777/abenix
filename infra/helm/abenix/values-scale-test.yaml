# Overlay for scripts/scale-e2e.sh on a single node, never for production.
# Shorter windows so one run finishes in about 30 minutes, the stub LLM on pool
# pods so no run costs money, and every autoscaler this chart can render turned on.

scaling:
  keda:
    pollingInterval: 5
    cooldownPeriod: 30
    scaleDownStabilizationSeconds: 30
    scaleDownPeriodSeconds: 15
    # out of the way, check f lowers it for itself and the long runs must not hold pods up
    p95ThresholdMs: "600000"
  poolEnv:
    ABENIX_LLM_STUB: "1"
    CI: "true"
    # the pipelines post their side effects to the in-cluster webhook catcher
    CONNECTORS_ALLOW_PRIVATE_TARGETS: "true"
  dedicated:
    enabled: true
    maxReplicas: 2
    maxPools: 3
  pools:
    - key: default
      min_replicas: 1
      max_replicas: 3
      concurrency_per_replica: 2
      termination_grace_seconds: 180
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 500m, memory: 768Mi }
    # never started until a run lands on it
    - key: long-running
      min_replicas: 0
      max_replicas: 2
      concurrency_per_replica: 1
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 500m, memory: 768Mi }
    # its autoscaler is paused during the run, so nothing ever picks its runs up
    - key: chat
      min_replicas: 0
      max_replicas: 1
      concurrency_per_replica: 1
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 500m, memory: 768Mi }

api:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50
  env:
    STALE_EXECUTION_MAX_MINUTES: "3"

web:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50

worker:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50

cognifyWorker:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50

telemetryIngest:
  autoscaling:
    enabled: true
    kind: keda
    minReplicas: 1
    maxReplicas: 3
    targetMessagesPerSecond: 500
    targetQueued: 200
    pollingInterval: 5
    cooldownPeriod: 30
    scaleDownStabilizationSeconds: 30

telemetryRules:
  autoscaling:
    enabled: true
    kind: keda
    minReplicas: 1
    maxReplicas: 3
    targetLag: 100
    pollingInterval: 5
    cooldownPeriod: 30
    scaleDownStabilizationSeconds: 30

improvements:
  proofPool:
    enabled: true
    minReplicas: 0
    maxReplicas: 2
    keda:
      enabled: true
      queueTrigger: "1"
      pollingInterval: 5
      cooldownPeriod: 30
      scaleDownStabilizationSeconds: 30

codeRunners:
  maxReplicas: 3
  idleSeconds: 60
  # the bench is far past the normal 30, which would keep the runner warm on purpose
  hotCallsPerHour: 999999
