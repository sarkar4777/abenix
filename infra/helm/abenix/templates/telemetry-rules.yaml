{{- if and .Values.telemetryRules .Values.telemetryRules.enabled }}
{{- $tr := .Values.telemetryRules }}
{{- $apiImage := index .Values "api" "image" }}
{{- $repo := $tr.image.repository | default $apiImage.repository }}
{{- $tag := $tr.image.tag | default $apiImage.tag }}
{{- $pull := $tr.image.pullPolicy | default $apiImage.pullPolicy | default "IfNotPresent" }}
{{- $port := $tr.port | default 8091 }}
{{- $auto := $tr.autoscaling | default dict }}
{{- $name := printf "%s-telemetry-rules" .Release.Name }}
---
# signal rules evaluated off the ingest, one Redis stream per shard of tenants
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-rules
spec:
  {{- if not $auto.enabled }}
  replicas: {{ $tr.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-rules
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-rules
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: telemetry-rules
    spec:
      # shard leases are released on SIGTERM so a rolling restart hands over at once
      terminationGracePeriodSeconds: 20
      {{- with $tr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if $tr.affinity }}
        {{- toYaml $tr.affinity | nindent 8 }}
        {{- else }}
        # the pool only isolates the ingest when it does not share its CPU, so keep them apart when possible
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- if ne (toString $tr.avoidIngest) "false" }}
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: telemetry-ingest
                    app.kubernetes.io/instance: {{ .Release.Name }}
            {{- end }}
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: telemetry-rules
                    app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-redis-master 6379; do echo waiting for redis; sleep 2; done']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: telemetry-rules
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["python", "-m", "app.telemetry.rules.pool"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: TELEMETRY_RULES_PORT
              value: {{ $port | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
            - configMapRef:
                name: {{ .Release.Name }}-config
          resources:
            {{- toYaml $tr.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-rules
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-rules
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: health
      port: {{ $port }}
      targetPort: health
{{- $pdb := $tr.pdb | default dict }}
{{- if and $pdb.enabled (or $auto.enabled (gt (int ($tr.replicaCount | default 1)) 1)) }}
---
# a drain or node upgrade never takes the last pool replica, its shards always have a home
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-rules
spec:
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-rules
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if $auto.enabled }}
{{- if eq ($auto.kind | default "keda") "keda" }}
---
# scales the pool on the readings waiting in the shard streams, from /scale
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-rules
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: {{ $auto.minReplicas | default 1 }}
  maxReplicaCount: {{ $auto.maxReplicas | default 8 }}
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: metrics-api
      metadata:
        url: "http://{{ $name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ $port }}/scale"
        valueLocation: "lag"
        targetValue: {{ $auto.targetLag | default 5000 | quote }}
{{- else }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-rules
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $auto.minReplicas | default 1 }}
  maxReplicas: {{ $auto.maxReplicas | default 8 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
{{- end }}
{{- end }}
