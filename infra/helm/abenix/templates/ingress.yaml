{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "abenix.fullname" . }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
  annotations:
    {{- $defaults := dict "nginx.ingress.kubernetes.io/proxy-body-size" (.Values.ingress.maxBodySize | default "21g") "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-request-buffering" "off" }}
    {{- toYaml (merge (dict) (.Values.ingress.annotations | default dict) $defaults) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: {{ ((.Values.web).service).port | default 3000 }}
{{- end }}
