{{- if .Values.scaling.enabled }}
{{- $dedicated := default dict .Values.scaling.dedicated }}
# The API reads which pools exist before it queues a run, and creates dedicated pools.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-runtime-pools
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    {{- if $dedicated.enabled }}
    verbs: ["get", "list", "create", "patch", "delete"]
    {{- else }}
    verbs: ["get", "list"]
    {{- end }}
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    {{- if $dedicated.enabled }}
    verbs: ["get", "list", "create", "patch", "delete"]
    {{- else }}
    verbs: ["get", "list"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-runtime-pools
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-runtime-pools
  apiGroup: rbac.authorization.k8s.io
{{- end }}
