apiVersion: v1
kind: ConfigMap
metadata:
  name: abenix-config
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
data:
  # Non-sensitive configuration only — credentials are in abenix-secrets
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}
  DEBUG: {{ if eq (.Values.environment | default "production") "production" }}"false"{{ else }}"true"{{ end }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  # Edge signing policy, the API logs an error when this is true outside dev
  EDGE_ALLOW_UNSIGNED: {{ if and .Values.edge .Values.edge.allowUnsigned }}"true"{{ else }}"false"{{ end }}
  # Marketplace and monetization defaults, an admin can override both at runtime
  {{- $features := default dict .Values.features }}
  MARKETPLACE_ENABLED: {{ (hasKey $features "marketplace" | ternary $features.marketplace true) | quote }}
  MONETIZATION_ENABLED: {{ (hasKey $features "monetization" | ternary $features.monetization false) | quote }}
  PGSSLMODE: "disable"
  RUNTIME_MODE: {{ .Values.runtimeMode | default "embedded" | quote }}
  RUNTIME_URL: "http://{{ .Release.Name }}-agent-runtime:8001"
  # runtime and worker call the API for approvals and gates
  INTERNAL_API_URL: "http://{{ .Release.Name }}-api:8000"
  # Wave-2: when true, the API publishes agent jobs onto the queue
  # backend instead of running them inline. Requires per-pool
  # Deployments (scaling.enabled) + a valid queueBackend selection.
  SCALING_EXEC_REMOTE: {{ .Values.scaling.execRemote | default false | quote }}
  # Platform alerts: Alertmanager posts to /api/admin/alerts/webhook, the
  # alerts page reads Alertmanager first and falls back to Prometheus.
  {{- $alerting := default dict .Values.alerting }}
  {{- $platformAlerts := default dict $alerting.platformAlerts }}
  {{- $am := default dict $alerting.alertmanager }}
  {{- $amEnabled := true }}
  {{- if hasKey $am "enabled" }}{{- $amEnabled = $am.enabled }}{{- end }}
  PROMETHEUS_URL: {{ default (printf "http://%s-prometheus.%s.svc.cluster.local:9090" .Release.Name .Release.Namespace) $alerting.prometheusUrl | quote }}
  {{- if $amEnabled }}
  ALERTMANAGER_URL: {{ default (printf "http://%s-alertmanager.%s.svc.cluster.local:9093" .Release.Name .Release.Namespace) $alerting.alertmanagerUrl | quote }}
  {{- end }}
  PLATFORM_ALERTS_ENABLED: {{ (hasKey $platformAlerts "enabled" | ternary $platformAlerts.enabled true) | quote }}
  PLATFORM_ALERT_DEDUPE_MINUTES: {{ default (default 30 $platformAlerts.dedupeMinutes) $alerting.dedupeMinutes | quote }}
  QUEUE_BACKEND: {{ default "celery" .Values.scaling.queueBackend | quote }}
  {{- if eq (default "celery" .Values.scaling.queueBackend) "nats" }}
  NATS_URL: "nats://{{ .Release.Name }}-nats:4222"
  NATS_USER: "abenix"
  {{- end }}
  NEO4J_URI: "bolt://{{ .Release.Name }}-neo4j:7687"
  NEO4J_DATABASE: {{ .Values.neo4j.database | default "neo4j" | quote }}
  # Default matches the index the worker code references and the README
  # documents. The previous default of plain "abenix" 404'd in
  # every real account because nobody's index is named that.
  PINECONE_INDEX_NAME: {{ .Values.pinecone.indexName | default "agentforge-knowledge" | quote }}
  # Azure OpenAI embedding deployment name — paired with
  # AZURE_OPENAI_API_KEY + AZURE_OPENAI_API_BASE from abenix-secrets so
  # the worker / agent-runtime embed via Azure instead of direct OpenAI
  # (which hits insufficient_quota in this tenant).
  AZURE_EMBEDDING_DEPLOYMENT: {{ .Values.azureEmbeddingDeployment | default "text-embedding-3-small" | quote }}
  UPLOAD_DIR: {{ .Values.objectStorage.uploadDir | default "/data/uploads" | quote }}
  EXPORT_DIR: {{ .Values.objectStorage.exportDir | default "/data/exports" | quote }}
  STORAGE_BACKEND: {{ .Values.objectStorage.type | default "local" | quote }}
  STORAGE_LOCAL_DIR: {{ .Values.objectStorage.uploadDir | default "/data/uploads" | quote }}
  # ML model files + Code Runner asset zips + build cache — all under
  # the shared /data mount so worker pods see what API uploaded. On
  # minikube /data is a hostPath; for multi-node k8s flip the
  # `sharedData.usePVC` value to switch this dir to a ReadWriteMany PVC.
  ML_MODELS_DIR: {{ .Values.objectStorage.mlModelsDir | default "/data/ml-models" | quote }}
  CODE_ASSET_STORE: {{ .Values.objectStorage.codeAssetStore | default "/data/code-assets" | quote }}
  CODE_ASSET_BUILD_CACHE: {{ .Values.objectStorage.codeAssetBuildCache | default "/data/code-asset-cache" | quote }}
  {{- if eq (.Values.objectStorage.type | default "local") "s3" }}
  STORAGE_S3_BUCKET: {{ .Values.objectStorage.bucket | quote }}
  STORAGE_S3_REGION: {{ .Values.objectStorage.region | default "us-east-1" | quote }}
  STORAGE_S3_ENDPOINT: {{ .Values.objectStorage.endpoint | default "" | quote }}
  {{- end }}
  {{- if eq (.Values.objectStorage.type | default "local") "azure" }}
  STORAGE_AZURE_CONTAINER: {{ .Values.objectStorage.container | default "abenix-files" | quote }}
  {{- end }}
  DATABASE_HOST: "{{ .Release.Name }}-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.databaseName | default "abenix" | quote }}
  FRONTEND_URL: {{ .Values.frontendUrl | default "http://localhost:3000" | quote }}
  # Browser origins allowed to call the API. The web UI's host port is not
  # always 3000 — deploy.sh takes WEB_PORT — so every origin the browser may
  # use has to be listed here or the UI gets CORS-blocked.
  CORS_ORIGINS: {{ .Values.corsOrigins | default (list "http://localhost:3000") | toJson | quote }}
  # Sandboxed-job runner — on by default in every deploy. Override the
  # allow-list via .Values.sandboxedJob.allowedImages.
  SANDBOXED_JOB_ENABLED: {{ .Values.sandboxedJob.enabled | default "true" | quote }}
  # Cluster view: lets the page name the helm value when reads are refused
  {{- $cvRbac := default dict (default dict .Values.clusterView).rbac }}
  CLUSTER_VIEW_RBAC: {{ ternary (toString $cvRbac.enabled) "true" (hasKey $cvRbac "enabled") | quote }}
  HELM_RELEASE: {{ .Release.Name | quote }}
  # Code-runner assets often need outbound HTTP (pip installs, dataset
  # pulls, etc.). Admins can flip this off per-cluster if the security
  # posture demands it, but default allows it so the feature works.
  SANDBOXED_JOB_ALLOW_NETWORK: {{ .Values.sandboxedJob.allowNetwork | default "true" | quote }}
  # ML model k8s deploy image — each deployed model gets its own Pod
  # pulling this image. Must point at a registry reachable from the
  # cluster (defaults to the local minikube registry; override for AKS).
  ML_MODEL_SERVING_IMAGE: {{ .Values.mlModels.servingImage | default "localhost:5000/abenix/model-serving:latest" | quote }}
  # Default allow-list covers the core code_asset languages (Python, Node,
  # Go, Rust, Ruby, Java). Operators can tighten or broaden via
  # .Values.sandboxedJob.allowedImages. The code_asset tool picks the
  # tightest-fitting tag for the asset's declared version.
  SANDBOXED_JOB_ALLOWED_IMAGES: {{ .Values.sandboxedJob.allowedImages | default "alpine:3.20,busybox:1.36,python:3.8-slim,python:3.9-slim,python:3.10-slim,python:3.11-slim,python:3.12-slim,python:3.13-slim,node:18-alpine,node:20-alpine,node:22-alpine,golang:1.21-alpine,golang:1.22-alpine,golang:1.23-alpine,rust:1.75-slim,ruby:3.2-slim,ruby:3.3-slim,eclipse-temurin:11-jdk,eclipse-temurin:17-jdk,eclipse-temurin:21-jdk" | quote }}
  {{- if .Values.sandboxedJob.namespace }}
  SANDBOXED_JOB_NAMESPACE: {{ .Values.sandboxedJob.namespace | quote }}
  {{- end }}
  # Hosts are the release names deploy.sh installs these charts under; an extra
  # "-mqtt-"/"-tsdb-" segment used to make both resolve to nothing.
  MQTT_URL: "mqtt://{{ .Values.streaming.mqttHost | default (printf "%s-mosquitto" .Release.Name) }}.{{ .Release.Namespace }}.svc.cluster.local:1883"
  # TSDB_URL is the name tsdb_query reads; it was published as TSDB_DSN.
  TSDB_URL: "postgresql://{{ .Values.streaming.tsdbUser | default "abenix" }}:{{ .Values.streaming.tsdbPassword | default "abenix" }}@{{ .Values.streaming.tsdbHost | default (printf "%s-timescaledb" .Release.Name) }}.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.streaming.tsdbDatabase | default "abenix_tsdb" }}"
  # Meeting Representative — LiveKit config. Secrets live in abenix-secrets.
  {{- if .Values.meeting }}
  LIVEKIT_URL: {{ .Values.meeting.livekit.url | default "" | quote }}
  LIVEKIT_MEET_URL: {{ .Values.meeting.livekit.meetUrl | default "https://meet.livekit.io" | quote }}
  OPENAI_TTS_VOICE: {{ .Values.meeting.ttsVoice | default "alloy" | quote }}
  {{- if .Values.meeting.deferNotifyWebhookUrl }}
  DEFER_NOTIFY_WEBHOOK_URL: {{ .Values.meeting.deferNotifyWebhookUrl | quote }}
  {{- end }}
  {{- end }}
  # Progress pub/sub namespacing. Each consuming app picks its own prefix
  # so the wingman Desk stream and contractiq live-canvas don't collide.
  # The engine stays generic — no app name baked into the runtime.
  PROGRESS_CHANNEL_PREFIX: {{ .Values.progress.channelPrefix | default "progress:" | quote }}
  PROGRESS_PARENT_KEY_PREFIX: {{ .Values.progress.parentKeyPrefix | default "parent:" | quote }}
  PROGRESS_PARENT_TTL: {{ .Values.progress.parentTtl | default "1800" | quote }}
  # Comma-separated list of post-processor modules the runtime imports at
  # startup. Each module registers its bindings with engine.post_processors
  # via side-effect imports. Keep this app-owned; the engine knows nothing
  # about which commodities or workflows it covers.
  POST_PROCESSOR_MODULES: {{ .Values.postProcessorModules | default "" | quote }}
  # MCP server URL allow-list. Comma-separated host suffixes that
  # _validate_mcp_url() permits in addition to the default public-host
  # rules. Required so the in-cluster UAT MCP fixture
  # (uat-mcp.<ns>.svc.cluster.local) can be registered — without it the
  # validator's cluster-internal DNS block rejects every register call
  # with "server_url rejected: cluster-internal DNS blocked".
  MCP_ALLOWED_HOSTS: {{ .Values.mcpAllowedHosts | default (printf "uat-mcp.%s.svc.cluster.local" .Release.Namespace) | quote }}
  # in-cluster webhook receivers that may resolve to private addresses, exact names
  EVENTS_ALLOWED_INTERNAL_HOSTS: {{ .Values.eventsAllowedInternalHosts | default "" | quote }}
  # Warm code runners, see templates/code-runners.yaml
  {{- $cr := default dict .Values.codeRunners }}
  {{- if $cr.enabled }}
  {{- $reg := default "localhost:5000/abenix" $cr.registry }}
  {{- $images := dict }}
  {{- range $cr.pools }}
  {{- $_ := set $images .name (printf "%s/%s:%s" $reg .image (toString (default "latest" $cr.imageTag))) }}
  {{- end }}
  CODE_RUNNER_MODE: {{ default "auto" $cr.mode | quote }}
  CODE_RUNNER_IMAGES: {{ toJson $images | quote }}
  CODE_RUNNER_PULL_POLICY: {{ default "IfNotPresent" $cr.pullPolicy | quote }}
  CODE_RUNNER_CONCURRENCY: {{ default 4 $cr.concurrency | quote }}
  CODE_RUNNER_MAX_REPLICAS: {{ default 5 $cr.maxReplicas | quote }}
  CODE_RUNNER_IDLE_SECONDS: {{ default 900 $cr.idleSeconds | quote }}
  CODE_RUNNER_DRAIN_SECONDS: {{ default 120 $cr.drainSeconds | quote }}
  CODE_RUNNER_GRACE_SECONDS: {{ default 930 $cr.graceSeconds | quote }}
  CODE_RUNNER_MIN_WARM: {{ default "low=0,medium=0,high=1,critical=1" $cr.minWarmByTier | quote }}
  CODE_RUNNER_HOT_CALLS_PER_HOUR: {{ default 30 $cr.hotCallsPerHour | quote }}
  CODE_RUNNER_DEFAULT_TIER: {{ default "medium" $cr.defaultTier | quote }}
  CODE_RUNNER_FETCH_TTL: {{ default 21600 $cr.fetchTokenTtl | quote }}
  CODE_RUNNER_API_URL: {{ default (printf "http://%s-api.%s.svc.cluster.local:8000" .Release.Name .Release.Namespace) $cr.apiUrl | quote }}
  CODE_RUNNER_NATS_URL: "nats://{{ .Release.Name }}-nats.{{ .Release.Namespace }}.svc.cluster.local:4222"
  CODE_RUNNER_NATS_SECRET: "{{ .Release.Name }}-code-runner-nats"
  CODE_RUNNER_RUNTIME_CLASS: {{ default "" $cr.runtimeClassName | quote }}
  CODE_RUNNER_EXEC_RESOURCES: {{ toJson (default dict (default dict $cr.resources).exec) | quote }}
  CODE_RUNNER_GATEWAY_RESOURCES: {{ toJson (default dict (default dict $cr.resources).gateway) | quote }}
  CODE_RUNNER_WS_SIZE: {{ default "2Gi" $cr.workspaceSize | quote }}
  CODE_RUNNER_SCRATCH_SIZE: {{ default "1Gi" $cr.scratchSize | quote }}
  {{- $keda := default dict $cr.keda }}
  CODE_RUNNER_KEDA: {{ default false $keda.enabled | quote }}
  CODE_RUNNER_PROMETHEUS_URL: {{ default "" $keda.prometheusUrl | quote }}
  {{- else }}
  CODE_RUNNER_MODE: "job"
  {{- end }}
