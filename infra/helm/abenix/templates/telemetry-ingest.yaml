{{- if .Values.telemetryIngest.enabled }}
{{- $ti := .Values.telemetryIngest }}
{{- $apiImage := index .Values "api" "image" }}
{{- $repo := $ti.image.repository | default $apiImage.repository }}
{{- $tag := $ti.image.tag | default $apiImage.tag }}
{{- $pull := $ti.image.pullPolicy | default $apiImage.pullPolicy | default "IfNotPresent" }}
{{- $port := $ti.port | default 8090 }}
{{- $pools := $ti.pools | default (list (dict "name" "default")) }}
{{- range $pool := $pools }}
{{- $isDefault := eq $pool.name "default" }}
{{- $name := ternary (printf "%s-telemetry-ingest" $.Release.Name) (printf "%s-telemetry-ingest-%s" $.Release.Name $pool.name) $isDefault }}
{{- $app := ternary "telemetry-ingest" (printf "telemetry-ingest-%s" $pool.name) $isDefault }}
{{- $auto := mergeOverwrite (deepCopy ($ti.autoscaling | default dict)) ($pool.autoscaling | default dict) }}
{{- $replicas := $pool.replicaCount | default (ternary $ti.replicaCount 1 $isDefault) | default 1 }}
---
# telemetry ingest pool {{ $pool.name }}: {{ join ", " ($pool.transports | default (list "every transport")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: telemetry-ingest
    abenix.io/ingest-pool: {{ $pool.name }}
spec:
  {{- if not $auto.enabled }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $app }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: telemetry-ingest
        abenix.io/ingest-pool: {{ $pool.name }}
    spec:
      # leases are released on SIGTERM so a rolling restart hands over at once
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ $.Release.Name }}-redis-master 6379; do echo waiting for redis; sleep 2; done']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: telemetry-ingest
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["python", "-m", "app.telemetry.ingest"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: TELEMETRY_POOL
              value: {{ $pool.name | quote }}
            - name: TELEMETRY_TRANSPORTS
              value: {{ join "," ($pool.transports | default list) | quote }}
            - name: TELEMETRY_INGEST_PORT
              value: {{ $port | quote }}
            - name: TELEMETRY_QUEUE_MAX
              value: {{ $ti.queueMax | default 20000 | quote }}
            - name: TELEMETRY_HISTORY_BUFFER
              value: {{ $ti.historyBuffer | default 200000 | quote }}
          envFrom:
            - secretRef:
                name: {{ $.Release.Name }}-secrets
            - configMapRef:
                name: {{ $.Release.Name }}-config
          resources:
            {{- toYaml ($pool.resources | default $ti.resources) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: telemetry-ingest
    abenix.io/ingest-pool: {{ $pool.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: health
      port: {{ $port }}
      targetPort: health
{{- if $auto.enabled }}
{{- if eq ($auto.kind | default "keda") "keda" }}
---
# scales this pool on the messages a second and queued messages its replicas report on /scale
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: telemetry-ingest
    abenix.io/ingest-pool: {{ $pool.name }}
spec:
  scaleTargetRef:
    name: {{ $name }}
  minReplicaCount: {{ $auto.minReplicas | default 1 }}
  maxReplicaCount: {{ $auto.maxReplicas | default 4 }}
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: metrics-api
      metadata:
        url: "http://{{ $name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}/scale"
        valueLocation: "messages_per_second"
        targetValue: {{ $auto.targetMessagesPerSecond | default 4000 | quote }}
    - type: metrics-api
      metadata:
        url: "http://{{ $name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}/scale"
        valueLocation: "queued"
        targetValue: {{ $auto.targetQueued | default 2000 | quote }}
{{- else }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "abenix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: telemetry-ingest
    abenix.io/ingest-pool: {{ $pool.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $auto.minReplicas | default 1 }}
  maxReplicas: {{ $auto.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
