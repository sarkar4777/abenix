apiVersion: v1
kind: Secret
metadata:
  name: abenix-secrets
  labels:
    {{- include "abenix.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Application env var keys (UPPER_CASE) — consumed by envFrom secretRef */}}
  {{- $redisAuth := "" }}
  {{- if .Values.secrets.redisPassword }}
  {{- $redisAuth = printf ":%s@" .Values.secrets.redisPassword }}
  {{- end }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ printf "redis://%s%s-redis-master:6379" $redisAuth .Release.Name | b64enc | quote }}
  SECRET_KEY: {{ .Values.secrets.jwtSecret | default "change-me" | b64enc | quote }}
  CELERY_BROKER_URL: {{ printf "redis://%s%s-redis-master:6379/0" $redisAuth .Release.Name | b64enc | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://%s%s-redis-master:6379/1" $redisAuth .Release.Name | b64enc | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | b64enc | quote }}
  {{- /* Claude Pro/Max subscription token. Optional — an admin can instead
        paste it into Admin -> LLM Settings, which stores it in
        platform_settings and takes precedence over this value. */}}
  CLAUDE_SUBSCRIPTION_TOKEN: {{ .Values.secrets.claudeSubscriptionToken | default "" | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | b64enc | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | default "" | b64enc | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | default "" | b64enc | quote }}
  AZURE_OPENAI_API_BASE: {{ .Values.secrets.azureOpenaiApiBase | default "" | b64enc | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureOpenaiApiVersion | default "2024-10-01-preview" | b64enc | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | default "abenix-neo4j-pass" | b64enc | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "" | b64enc | quote }}
  PINECONE_API_KEY: {{ .Values.secrets.pineconeApiKey | default "" | b64enc | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | default "" | b64enc | quote }}
  BRAVE_SEARCH_API_KEY: {{ .Values.secrets.braveSearchApiKey | default "" | b64enc | quote }}
  SERPAPI_API_KEY: {{ .Values.secrets.serpapiApiKey | default "" | b64enc | quote }}
  SERPER_API_KEY: {{ .Values.secrets.serperApiKey | default "" | b64enc | quote }}
  SEARCH_PROVIDER: {{ .Values.secrets.searchProvider | default "tavily" | b64enc | quote }}
  NEWS_API_KEY: {{ .Values.secrets.newsApiKey | default "" | b64enc | quote }}
  FRED_API_KEY: {{ .Values.secrets.fredApiKey | default "" | b64enc | quote }}
  ALPHA_VANTAGE_API_KEY: {{ .Values.secrets.alphaVantageApiKey | default "" | b64enc | quote }}
  MEDIASTACK_API_KEY: {{ .Values.secrets.mediastackApiKey | default "" | b64enc | quote }}
  ENTSOE_API_KEY: {{ .Values.secrets.entsoeApiKey | default "" | b64enc | quote }}
  EIA_API_KEY: {{ .Values.secrets.eiaApiKey | default "" | b64enc | quote }}
  CONTRACTIQ_JWT_SECRET: {{ .Values.secrets.contractiqJwtSecret | default "contractiq-dev-secret" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | default "" | b64enc | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPassword | default "" | b64enc | quote }}
  {{- /* Alertmanager -> API webhook token. Generated once, kept across upgrades. */}}
  {{- $alertToken := .Values.secrets.alertWebhookToken | default "" }}
  {{- if not $alertToken }}
  {{- $live := lookup "v1" "Secret" .Release.Namespace "abenix-secrets" }}
  {{- if and $live $live.data (hasKey $live.data "ALERT_WEBHOOK_TOKEN") }}
  {{- $alertToken = index $live.data "ALERT_WEBHOOK_TOKEN" | b64dec }}
  {{- else }}
  {{- $alertToken = randAlphaNum 40 }}
  {{- end }}
  {{- end }}
  ALERT_WEBHOOK_TOKEN: {{ $alertToken | b64enc | quote }}
  {{- /* NATS logins. Generated once and kept, a value in secrets.nats* wins. */}}
  {{- $liveSecrets := lookup "v1" "Secret" .Release.Namespace "abenix-secrets" }}
  {{- range $k, $v := dict "NATS_PASSWORD" ((.Values.secrets).natsPassword | default "") "NATS_SYS_PASSWORD" ((.Values.secrets).natsSysPassword | default "") }}
  {{- $val := $v }}
  {{- if not $val }}
  {{- if and $liveSecrets $liveSecrets.data (hasKey $liveSecrets.data $k) }}
  {{- $val = index $liveSecrets.data $k | b64dec }}
  {{- else }}
  {{- $val = randAlphaNum 32 }}
  {{- end }}
  {{- end }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- /* Cluster KEK for at-rest encryption, 32 bytes base64. Tool credentials
        saved from Admin -> Tool Configuration and persona memory are encrypted
        with it. Empty means those values are stored as entered. */}}
  {{- /* SSO providers, written only when set so an empty key never reads as configured */}}
  {{- range $k, $v := dict "GOOGLE_OIDC_CLIENT_ID" "googleClientId" "GOOGLE_OIDC_CLIENT_SECRET" "googleClientSecret" "GITHUB_OAUTH_CLIENT_ID" "githubClientId" "GITHUB_OAUTH_CLIENT_SECRET" "githubClientSecret" "MICROSOFT_OIDC_CLIENT_ID" "microsoftClientId" "MICROSOFT_OIDC_CLIENT_SECRET" "microsoftClientSecret" "MICROSOFT_OIDC_TENANT" "microsoftTenant" }}
  {{- $sv := index (default dict $.Values.secrets.sso) $v | default "" }}
  {{- if $sv }}
  {{ $k }}: {{ $sv | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.dataKeyKekBase64 }}
  ABENIX_DATA_KEY_KEK_BASE64: {{ .Values.secrets.dataKeyKekBase64 | b64enc | quote }}
  {{- end }}
  {{- /* Edge bundle signing key pair. Without the private key the API answers
        503 on compile/sign/mint outside dev, it never mints one itself. */}}
  {{- if .Values.secrets.edgeSigningKeyPem }}
  EDGE_SIGNING_KEY_PEM: {{ .Values.secrets.edgeSigningKeyPem | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.edgeSigningPubkeyPem }}
  EDGE_SIGNING_PUBKEY_PEM: {{ .Values.secrets.edgeSigningPubkeyPem | b64enc | quote }}
  {{- end }}
  {{- if eq (.Values.objectStorage.type | default "local") "s3" }}
  STORAGE_S3_ACCESS_KEY: {{ .Values.secrets.storageS3AccessKey | default "" | b64enc | quote }}
  STORAGE_S3_SECRET_KEY: {{ .Values.secrets.storageS3SecretKey | default "" | b64enc | quote }}
  {{- end }}
  {{- if eq (.Values.objectStorage.type | default "local") "azure" }}
  STORAGE_AZURE_CONNECTION_STRING: {{ .Values.secrets.storageAzureConnectionString | default "" | b64enc | quote }}
  {{- end }}
  {{- /* Kebab-case keys — required by Bitnami PostgreSQL/Redis subcharts */}}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  redis-url: {{ printf "redis://%s%s-redis-master:6379" $redisAuth .Release.Name | b64enc | quote }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default "change-me" | b64enc | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | default "abenix-neo4j-pass" | b64enc | quote }}
  stripe-secret-key: {{ .Values.secrets.stripeSecretKey | default "" | b64enc | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | default "" | b64enc | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | default "" | b64enc | quote }}
  pinecone-api-key: {{ .Values.secrets.pineconeApiKey | default "" | b64enc | quote }}
  google-api-key: {{ .Values.secrets.googleApiKey | default "" | b64enc | quote }}
  storage-s3-access-key: {{ .Values.secrets.storageS3AccessKey | default "" | b64enc | quote }}
  storage-s3-secret-key: {{ .Values.secrets.storageS3SecretKey | default "" | b64enc | quote }}
  storage-azure-connection-string: {{ .Values.secrets.storageAzureConnectionString | default "" | b64enc | quote }}
