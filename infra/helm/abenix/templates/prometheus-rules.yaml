{{- /*
Prometheus alert rules — packaged as a regular ConfigMap rather than a
PrometheusRule CRD. The Abenix cluster runs a thin single-binary
Prometheus (infra/observability/prometheus.yaml), NOT the prometheus-
operator stack, so the CRD form would silently never load.

The companion ConfigMap is mounted at /etc/prometheus/rules/ on the
Prometheus pod and picked up via `rule_files:` in prometheus.yml.

Conditional on monitoring.prometheusRules.enabled — defaults to ON so a
fresh install gets alerts immediately.
*/}}
{{- $mon := default dict .Values.monitoring }}
{{- $rules := default dict $mon.prometheusRules }}
{{- $rulesEnabled := true }}
{{- if hasKey $rules "enabled" }}{{- $rulesEnabled = $rules.enabled }}{{- end }}
{{- if $rulesEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    abenix.io/rulegroup: api
data:
  alerts.yml: |
    groups:
      - name: abenix.api
        rules:
          - alert: HighErrorRate
            expr: |
              rate(abenix_http_requests_total{status=~"5.."}[5m])
              / rate(abenix_http_requests_total[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Abenix API error rate > 5%"
              description: "{{ "{{" }} $value | humanizePercentage {{ "}}" }} of requests are failing"

          - alert: AuditChainBroken
            expr: increase(abenix_audit_chain_breaks_total[1d]) > 0
            labels:
              severity: critical
            annotations:
              summary: "An activity log failed its integrity check"
              description: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }}: an entry was changed or removed. See Admin, Risk and Controls, Audit integrity."

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, rate(abenix_http_request_duration_seconds_bucket[5m])) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Abenix API p95 latency > 2s"

          - alert: ExecutionFailureRate
            expr: |
              rate(abenix_executions_completed_total{status="failed"}[10m])
              / rate(abenix_executions_completed_total[10m]) > 0.2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Agent execution failure rate > 20%"

          - alert: PostgresDown
            expr: abenix_health_check{component="postgres"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL is unreachable"

          - alert: RedisDown
            expr: abenix_health_check{component="redis"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Redis is unreachable"
{{- end }}
