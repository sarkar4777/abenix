replicaCount: 3

image:
  repository: abenix/api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

health:
  path: /api/health
  initialDelaySeconds: 10
  periodSeconds: 30

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env: {}
envFrom: []

nodeSelector: {}
tolerations: []

# When enabled, mounts the umbrella ml-models PVC at /data/ml-models so
# the abenix-api pod and the agent-runtime pool pods see the same pickle
# files. Required on multi-node clusters; off on single-node dev where
# the hostPath at /data already covers it.
mlModelsPVC:
  enabled: false
  claimName: ml-models-storage

# Mounts the umbrella shared-data claim at /data instead of the host path.
# Turn on with sharedData.usePVC on any cluster with more than one node.
sharedDataPVC:
  enabled: false
  claimName: abenix-shared-data

# Mounts the umbrella archives PVC at /data/archives (local object-storage
# mode only). Off by default so a plain install does not demand a claim.
archivesPVC:
  enabled: false
  claimName: abenix-archives
