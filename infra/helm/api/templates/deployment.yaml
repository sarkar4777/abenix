apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-postgresql 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: init-data-dirs
          image: busybox:1.36
          # The PVC mount at /data/ml-models lands under hostPath /data,
          # so the init container must mount it too — chmod must touch
          # the share itself, not the hostPath subdirectory it hides.
          command: ['sh', '-c', 'mkdir -p /data/uploads /data/exports /data/ml-models /data/code-assets /data/code-asset-cache /data/archives && chmod 777 /data/uploads /data/exports /data/ml-models /data/code-assets /data/code-asset-cache /data/archives']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.mlModelsPVC.enabled }}
            - name: ml-models
              mountPath: /data/ml-models
            {{- end }}
            {{- if and .Values.archivesPVC .Values.archivesPVC.enabled }}
            - name: archives
              mountPath: /data/archives
            {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: db-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['sh', '-c', 'cd /app/packages/db && python -m bootstrap && alembic upgrade heads']
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.mlModelsPVC.enabled }}
            # Overlay the umbrella ml-models-storage PVC on top of /data
            # so /data/ml-models is the only path that crosses pods.
            # Without this every pod has its own pod-local /data/ml-models
            # subdirectory and the agent-runtime can't read pickles the
            # api just wrote (split-brain we hit on AKS multi-node).
            - name: ml-models
              mountPath: /data/ml-models
            {{- end }}
            {{- if and .Values.archivesPVC .Values.archivesPVC.enabled }}
            # Archive dumps in local object-storage mode, see the umbrella
            # archives-pvc.yaml. Keeps them off the pod-local /data overlay.
            - name: archives
              mountPath: /data/archives
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          # /data is shared with the worker so document_processor can read
          # uploads the API wrote. On single-node minikube a hostPath
          # works (both pods land on the same node). For multi-node or
          # production, swap this for a ReadWriteMany PVC, NFS, or
          # S3-backed StorageService.
          hostPath:
            path: {{ .Values.sharedDataHostPath | default "/var/lib/abenix/data" }}
            type: DirectoryOrCreate
        {{- if .Values.mlModelsPVC.enabled }}
        - name: ml-models
          persistentVolumeClaim:
            claimName: {{ .Values.mlModelsPVC.claimName | default "ml-models-storage" }}
        {{- end }}
        {{- if and .Values.archivesPVC .Values.archivesPVC.enabled }}
        - name: archives
          persistentVolumeClaim:
            claimName: {{ .Values.archivesPVC.claimName | default "abenix-archives" }}
        {{- end }}
        - name: tmp
          emptyDir: {}
