image:
  repository: eclipse-mosquitto
  tag: "2.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# Anonymous-allowed by default so dev-cluster + minikube smoke work
# with no extra config. Flip require_auth=true and supply a userPasswordsB64
# blob (mosquitto password file format, base64 encoded) for prod.
auth:
  require_auth: false
  userPasswordsB64: ""

service:
  type: ClusterIP
  mqtt:
    port: 1883

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
