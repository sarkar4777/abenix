apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosquitto.fullname" . }}-config
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    {{- if .Values.auth.require_auth }}
    allow_anonymous false
    password_file /mosquitto/config/passwd
    {{- else }}
    allow_anonymous true
    {{- end }}
{{- if and .Values.auth.require_auth .Values.auth.userPasswordsB64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mosquitto.fullname" . }}-passwd
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
type: Opaque
data:
  passwd: {{ .Values.auth.userPasswordsB64 | quote }}
{{- end }}
