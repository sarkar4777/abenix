{{- define "testbed.nats.data" }}
  name: nats-config
  labels: {{- include "testbed.labels" . | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http: 8222
    server_name: testbed-nats
    max_payload: 1MB
    jetstream {
      store_dir: /data
      max_memory_store: 32MB
      max_file_store: 512MB
    }
    authorization {
      users = [
        {user: fleet, password: $FLEET_PASSWORD}
        {user: abenix, password: $ABENIX_PASSWORD, permissions: {
          publish: {allow: ["fleet.commands.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]}
          subscribe: {allow: ["fleet.>", "_INBOX.>"]}
        }}
        {user: restricted, password: $RESTRICTED_PASSWORD, permissions: {
          publish: {allow: ["_INBOX.>"]}
          subscribe: {allow: ["other.>", "_INBOX.>"]}
        }}
      ]
    }
{{- end }}
{{- if .Values.nats.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
{{ include "testbed.nats.data" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: {{- include "testbed.labels" . | nindent 4 }}
spec:
  selector: {app: nats}
  ports:
    - {name: client, port: 4222, targetPort: 4222}
    - {name: monitor, port: 8222, targetPort: 8222}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels: {{- include "testbed.labels" . | nindent 4 }}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats, testbed: broker}
      annotations:
        checksum/config: {{ include "testbed.nats.data" . | sha256sum | trunc 16 }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: FLEET_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "nats-admin-password") | nindent 14 }}
            - name: ABENIX_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "nats-password") | nindent 14 }}
            - name: RESTRICTED_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "restricted-password") | nindent 14 }}
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/nats}
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: nats-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
{{- end }}
