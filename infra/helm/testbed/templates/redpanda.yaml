{{- define "testbed.redpanda.data" }}
  name: redpanda-bootstrap
  labels: {{- include "testbed.labels" . | nindent 4 }}
data:
  .bootstrap.yaml: |
    enable_sasl: true
    sasl_mechanisms: ["SCRAM", "PLAIN"]
    superusers: ["admin"]
    auto_create_topics_enabled: false
    log_retention_ms: 3600000
    retention_bytes: 268435456
  users.sh: |
    set -u
    RPK="rpk -X brokers=localhost:9092 -X admin.hosts=localhost:9644 -X user=admin -X pass=${ADMIN_PASSWORD} -X sasl.mechanism=SCRAM-SHA-256"
    until $RPK cluster health 2>/dev/null | grep -q 'Healthy:.*true'; do sleep 2; done
    mk() { # mk <user> <password> <mechanism>
      $RPK security user create "$1" -p "$2" --mechanism "$3" >/dev/null 2>&1 \
        || $RPK security user update "$1" --new-password "$2" --mechanism "$3" >/dev/null 2>&1 || true
    }
    mk abenix "${ABENIX_PASSWORD}" SCRAM-SHA-256
    mk abenix512 "${ABENIX_PASSWORD}" SCRAM-SHA-512
    mk restricted "${RESTRICTED_PASSWORD}" SCRAM-SHA-256
    for u in abenix abenix512; do
      $RPK security acl create --allow-principal "User:$u" --operation all --resource-pattern-type prefixed \
        --topic shop. --topic plant. --topic load. --group abenix >/dev/null 2>&1 || true
    done
    $RPK security acl create --allow-principal User:restricted --operation all --resource-pattern-type prefixed --group abenix >/dev/null 2>&1 || true
    echo "users and ACLs are in place: abenix (SCRAM-SHA-256), abenix512 (SCRAM-SHA-512), restricted (no topics)"
    exec sleep infinity
{{- end }}
{{- if .Values.redpanda.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
{{ include "testbed.redpanda.data" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels: {{- include "testbed.labels" . | nindent 4 }}
spec:
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
    - {name: external, port: 19092, targetPort: 19092}
    - {name: admin, port: 9644, targetPort: 9644}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels: {{- include "testbed.labels" . | nindent 4 }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda, testbed: broker}
      annotations:
        checksum/config: {{ include "testbed.redpanda.data" . | sha256sum | trunc 16 }}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext: {fsGroup: 101}
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory={{ .Values.redpanda.memory }}
            - --reserve-memory=0M
            - --overprovisioned
            - --default-log-level=warn
            - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr=internal://redpanda.{{ .Release.Namespace }}.svc.cluster.local:9092,external://localhost:19092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda.{{ .Release.Namespace }}.svc.cluster.local:33145
          env:
            - name: RP_BOOTSTRAP_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecret }}, key: kafka-bootstrap-user}}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: external, containerPort: 19092}
            - {name: admin, containerPort: 9644}
          readinessProbe:
            httpGet: {path: /v1/status/ready, port: 9644}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
            - {name: bootstrap, mountPath: /etc/redpanda/.bootstrap.yaml, subPath: .bootstrap.yaml}
          resources: {{- toYaml .Values.redpanda.resources | nindent 12 }}
        - name: users
          image: {{ .Values.redpanda.image }}
          command: ["bash", "/scripts/users.sh"]
          env:
            - name: ADMIN_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "kafka-admin-password") | nindent 14 }}
            - name: ABENIX_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "kafka-password") | nindent 14 }}
            - name: RESTRICTED_PASSWORD
              {{- include "testbed.secret" (dict "root" . "key" "restricted-password") | nindent 14 }}
          volumeMounts:
            - {name: bootstrap, mountPath: /scripts/users.sh, subPath: users.sh}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: bootstrap
          configMap: {name: redpanda-bootstrap}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
{{- end }}
