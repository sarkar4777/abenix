{{- include "edge-runtime-c.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "edge-runtime-c.fullname" . }}
  labels:
    {{- include "edge-runtime-c.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "edge-runtime-c.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "edge-runtime-c.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edge-runtime-c.selectorLabels" . | nindent 8 }}
      annotations:
        # the pod reads these at start, a changed token or key rolls it
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: edge-runtime-c
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: GATEWAY_ID
              value: {{ .Values.gateway_id | quote }}
            - name: GATEWAY_edge-runtime-c
              value: {{ .Values.gateway_name | quote }}
            - name: PLATFORM_URL
              value: {{ .Values.platform_url | quote }}
            - name: PLATFORM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "edge-runtime-c.fullname" . }}-secret
                  key: platform_token
                  optional: true
            - name: MQTT_URL
              value: {{ .Values.mqtt_url | quote }}
            - name: ENDPOINT_URL
              value: {{ .Values.endpoint_url | quote }}
            - name: SIGNING_PUBKEY_PATH
              value: /etc/edge/signing_pub.pem
            - name: EDGE_ALLOW_UNSIGNED
              value: {{ include "edge-runtime-c.literalTrue" .Values.allow_unsigned | quote }}
            - name: EDGE_ALLOW_NO_AUTH
              value: {{ include "edge-runtime-c.literalTrue" .Values.allow_no_auth | quote }}
            - name: EDGE_ENABLE_CODE_EXECUTOR
              value: {{ include "edge-runtime-c.literalTrue" .Values.code_executor_enabled | quote }}
            - name: TENANT_ID
              value: {{ .Values.tenant_id | default "" | quote }}
            - name: EDGE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "edge-runtime-c.fullname" . }}-secret
                  key: auth_token
            - name: BUNDLE_DIR
              value: /var/edge/agents
            {{- $llm := .Values.existing_llm_secret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if and $llm.name $llm.api_key_key }}
                  name: {{ $llm.name }}
                  key: {{ $llm.api_key_key }}
                  {{- else }}
                  name: {{ include "edge-runtime-c.fullname" . }}-secret
                  key: anthropic_api_key
                  {{- end }}
                  optional: true
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if and $llm.name $llm.auth_token_key }}
                  name: {{ $llm.name }}
                  key: {{ $llm.auth_token_key }}
                  {{- else }}
                  name: {{ include "edge-runtime-c.fullname" . }}-secret
                  key: anthropic_auth_token
                  {{- end }}
                  optional: true
            {{- with .Values.anthropic_base_url }}
            - name: ANTHROPIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: PORT
              value: "{{ .Values.service.port }}"
            {{- with .Values.extra_env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bundles
              mountPath: /var/edge/agents
            - name: signing
              mountPath: /etc/edge
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extra_volume_mounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extra_containers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: signing
          secret:
            secretName: {{ include "edge-runtime-c.fullname" . }}-secret
            items:
              - key: signing_pubkey
                path: signing_pub.pem
            optional: true
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: bundles
          emptyDir: {}
        {{- end }}
        {{- with .Values.extra_volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: bundles
      spec:
        accessModes: [ "{{ .Values.persistence.accessMode }}" ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
