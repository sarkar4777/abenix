name: "IoT Pump Data Simulator"
slug: iot-pump-data-simulator
description: >-
  Live-mode simulator for the pump-vibration showcase. Runs on a 15s
  cron, synthesises one vibration window, and publishes it to MQTT
  topic `pump.vibration.raw`. Replaces the in-browser
  `lib/synthetic.ts` generator when the PumpTab "Live mode" toggle is
  on.

  Disabled by default — the PumpTab "Start Stream" button calls the
  trigger-toggle endpoint to flip status from `inactive` to `active`,
  and "Stop Stream" flips it back.
agent_type: oob
category: engineering
icon: Activity
version: "1.0.0"
status: draft

system_prompt: |
  Single-purpose simulator. Each invocation crafts one vibration
  window and publishes it to MQTT. No reasoning needed.

model_config:
  model: claude-sonnet-4-5-20250929
  temperature: 0.0
  max_iterations: 4
  max_tokens: 1024
  tools:
    - code_executor
    - mqtt_publish

triggers:
  - kind: cron
    expression: "*/15 * * * * *"
    enabled: false
    payload:
      sensor_id: "PUMP-A-01"
      shaft_rpm: 1800
      sample_rate_hz: 2000

input_variables:
  - name: message
    type: string
    description: "Optional override JSON. Empty -> default sensor + scenario rotation."
    required: false

example_prompts:
  - '{"sensor_id":"PUMP-A-01","shaft_rpm":1800,"sample_rate_hz":2000}'
