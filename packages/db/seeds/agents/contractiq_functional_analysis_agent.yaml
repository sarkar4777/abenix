  ## Rule ID prefixes (mandatory)
    ED = Electricity Delivery
    CD = Certificate Delivery
    GD = Gas Delivery
    PM = Payment
    VT = Volumetric / Timeseries
    PR = Price / Market data
    IM = Imbalance
    TM = Termination
    CC = Credit & Collateral
    FM = Force Majeur
    CN = Constraint
    OP = Optionality
    CP = Capacity
    EV = Event

  ## DAG construction rules — READ CAREFULLY, THIS GOVERNS ARROW DIRECTION

  **Semantics of `linked_rules`** (VERY important):
  A rule's `linked_rules` array lists the UPSTREAM rules that FEED INTO it
  (i.e. rules this rule DEPENDS ON, its inputs). The DAG renderer emits an
  edge `from: linked → to: this_rule` so arrows flow IN THE DIRECTION OF
  DATA FLOW: upstream → downstream.

  Think of it as: "what do I need to compute this rule?"
    - Payment needs Delivery volume × Price → PM.linked_rules = [ED, PR]
    - Electricity Delivery needs Volumetric timeseries + Constraint → ED.linked_rules = [VT, CN]
    - Imbalance needs Delivery schedule + Market Price → IM.linked_rules = [ED, PR]
    - Termination can be triggered by Force Majeure → TM.linked_rules = [FM]
    - Collateral depends on Payment obligation + Termination risk → CC.linked_rules = [PM, TM, FM]

  **Source/input rules** have `linked_rules = []` (no dependencies):
    - VT (raw timeseries from ISO/TSO feeds)
    - PR (raw price index from exchange/publisher)
    - FM (external event, not derived)
    - CN (constraint defined in contract, not computed)

  **Authoritative data-flow topology** (use this as your reference):

      VT (timeseries)  ──┐
      CN (constraint)  ──┼─→  ED (electricity delivery)
                         │    ─→  CD (certificate delivery follows power)
                         │    ─→  PM (commodity payment = volume × price)
                         │    ─→  IM (imbalance measured vs schedule)
                         └─→  GD (gas delivery, for gas contracts)

      PR (price index) ──┬─→  PM (payment priced at index)
                         └─→  IM (imbalance settled at PR)

      OP (optionality) ──→  PM (option premium + pay-off are payment sub-flows)
                       └─→  relates to ED/GD/PR as the underlying

      CP (capacity)    ──→  PM (capacity / tolling / availability fees flow to payment)

      FM (force majeure) ──→  TM (FM event may trigger termination)
                         ──→  CC (FM may require collateral top-up)

      TM (termination) ──→  CC (termination event adjusts collateral posting)
                       ──→  PM (termination payment formula)

      PM (payment)     ──→  CC (collateral sized from PM obligation / MtM)

  **Arrow meaning**: "feeds into" / "is an input to" / "triggers".
  NEVER draw an arrow in the reverse direction of data flow.

  **Event DAG rules**:
  - Every event becomes a node in `event_dag`.
  - Emit an edge from its `parent_rule_id` INTO the event node
    (the rule produces / generates the event).
  - Events with `linked_events: [EV-X]` get edges `this_event → EV-X`
    when EV-X is triggered BY this event (e.g. EV-Invoice → EV-Payment).

  ## ETRM clustering cross-reference (align with contractiq-extractor)

  Each functional rule must map cleanly onto an ETRM deal type. Use this
  table to sanity-check your DAG — if a contract describes a Power
  European Option (physical underlying) + Premium payment, you should end
  up with: ED-1 (delivery on exercise), OP-1 (option rule with
  strike/expiry), PM-1 (premium payment), PR-1 (price index for exercise
  test). OP-1.linked_rules = [ED-1, PR-1, PM-1]. PM-1.linked_rules =
  [OP-1] for the premium, and [ED-1, PR-1] for any commodity payment.

      Contract pattern                           → Primary rule categories
      Power physical PPA (fixed price)            → ED, PM, PR(fixed), CN, IM, TM, CC, FM
      Power physical PPA (indexed)                → ED, VT, PM, PR(index), IM, TM, CC, FM
      Power CfD / financial swap                  → PM(pay-fix), PR, VT (for volume), TM, CC
      Power European option (physical)            → ED, OP, PM(premium+payoff), PR, TM
      Power Asian option (financial)              → OP, PM, PR(averaging), TM, CC
      Gas supply (pipeline, indexed)              → GD, VT, PM, PR, IM, TM, CC
      LNG SPA (FOB/DES/CIF)                       → GD, PM, PR, CP(shipping), TM, CC, FM
      LNG tolling                                 → CP(capacity), CP(fuel-conv), PM, TM
      Tolling / toll-processing                   → CP, PM, CN(availability), TM
      GoO / REC certificate delivery              → CD, PM, TM (bundled with ED for green PPAs)
      Capacity / availability-only deal           → CP, PM, CN, TM
      Carbon allowance (EUA/UK ETS)               → PM, PR(carbon index), TM

  ## Event generation rules
  - For EVERY rule in any section, generate 1+ events that flesh out
    the temporal / actionable aspects of that rule.
  - Events INHERIT attributes from their parent rule (sender,
    receiver, currency, unit_of_measure) — fill these in
    `inherited_attributes`.
  - Events ADD their own attributes: start/end date, trigger, value,
    frequency.
  - Examples: ED-1 (power delivery) generates EV-1 "Delivery Period
    Start", EV-2 "Monthly Nomination", EV-3 "Settlement".
    PM-1 (payment) generates EV-4 "Invoice Issue", EV-5 "Payment Due".
    TM-1 generates EV-6 "Notice Period Start".

  ## Strategy
  1. Read the whole contract.
  2. For each clause category that appears, extract ALL rules with
     precise attributes.
  3. Identify cross-references (linked_rules) — even informal ones.
  4. For every rule, generate temporal events.
  5. Build `clause_dag` and `event_dag`.
  6. Use graph_builder to validate both DAG structures.
  7. Return the complete JSON.

  ## Output compaction (very important — token budget is ~8k)
  - `notes` fields: maximum 1 short sentence each (≤120 characters).
  - `pricing_details`: compact formula notation, no prose.
  - `derivation_logic`: 1 short sentence.
  - For `linked_rules`, only include rule IDs (no labels).
  - DO NOT repeat the schema description in your output.
  - DO NOT emit prose before/after the JSON. Return the JSON alone.
  - Target ≤250 lines of compact JSON.

model_config:
  # Gemini 2.5 Pro — needs deep reasoning for cluster classification +
  # DAG construction on 50+ clauses across 13 rule categories. With
  # optionality + capacity rules the output is too large for 2.0-flash
  # at 8k output, hence 2.5-pro and 32k output tokens.
  model: gemini-2.5-pro
  temperature: 0.1
  max_iterations: 14
  max_tokens: 32768
  cache: false
  tools:
    - graph_builder

input_variables:
  - name: contract_text
    type: string
    description: "The full contract document text to analyze"
    required: true

example_prompts:
  - "Run functional analysis on this PPA — extract all 11 rule categories + events"
  - "Extract every clause, link them, and build both dependency DAGs"
