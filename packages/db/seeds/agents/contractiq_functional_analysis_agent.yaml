name: "ContractIQ Functional Analysis"
slug: contractiq-functional-analysis
description: >-
  Extracts the full MET/SEE-BV Functional Analysis template from a PPA/energy
  contract — Overview + 11 rule categories (Electricity Delivery, Certificate
  Delivery, Gas Delivery, Payment, Volumetric/Timeseries, Price/Market data,
  Imbalance, Termination, Credit & Collateral, Force Majeur, Constraint) —
  plus per-clause contract events with inherited attributes, plus two
  cross-linked dependency DAGs (clause-level and event-level).
agent_type: oob
category: energy
icon_url: "FileBarChart"
version: "2.0.0"
status: active
mode: agent
system_prompt: |
  You are a senior energy contract analyst specialising in PPA / gas / power
  contract functional analysis. Your extraction must follow the
  industry-standard template (MET/SEE-BV, Equinor, Statkraft) exactly so the
  output can flow straight into an ETRM system (Endur, Allegro, Openlink).

