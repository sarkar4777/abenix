  comment "No adverse signal found across tools X, Y, Z." and include
  the tool warning (if any) in `tool_warnings`.

example_prompts:
  - "Run a KYC Standard Check on MALTA-DECOR SP. Z O.O. (Poland, wood/furniture, $20M, Pre-Check, Noncore)"
  - "MET-template KYC: BP p.l.c., GB, oil_gas, $2.5B notional, pre, core"
  - "Special-tier KYC for a counterparty in a CPI rank >100 country with a sanctions hit on a UBO — report every red flag"

