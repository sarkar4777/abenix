    agent_permission: READ
    documents:
      - id: ve-knw-001
        title: "IEC 61400-3 §7.6 Foundation Loads & Fatigue (extract)"
        metadata: { standard: "IEC-61400-3", topic: "foundation" }
        content: |
          IEC 61400-3 — DESIGN REQUIREMENTS FOR OFFSHORE WIND TURBINES
          (FIXED-FOUNDATION) — clauses §7.6.1 through §7.6.7

          §7.6.1 General. The support structure shall be designed
          for the combined effect of wind, wave, current, sea ice
          and earthquake loads in the limit states defined in §7.4.
          Coupled aero-hydro-elastic time-domain simulation is
          required; a quasi-static approach is acceptable only when
          dynamic amplification factors are demonstrably below 1.05
          across the design wind range.

          §7.6.4 Fatigue. The fatigue analysis shall apply the
          DLC 1.2 (power production with normal turbulence) and
          DLC 6.4 (idling with extreme turbulence) cases to the
          full Markov matrix of wave heights and wind speeds for
          the site. The S-N curves used must be those of DNV-RP-C203
          for the chosen steel grade, with stress concentration
          factors derived from finite-element analysis at every
          tubular intersection. A minimum life of 25 years and a
          fatigue safety factor of 1.25 (consequence class 2) shall
          be applied. Inspection intervals are 5 years for monopile
          and 3 years for jacket/tripod welded joints.

          §7.6.5 Scour and seabed. For monopile foundations in
          erodible seabeds the scour depth shall be assumed equal
          to 1.3D where D is the pile diameter, unless site-specific
          modelling supports a lower value with a 50-year return
          period storm. Scour protection shall extend at least 2D
          radially from the pile axis.

          §7.6.6 Pile-soil interaction. P-y curves shall be derived
          per API RP 2GEO; for cyclic degradation the modified
          procedure of Jeanjean (2009) is acceptable for normally
          consolidated clays.

          §7.6.7 Welded joints. All primary welds shall be Class
          B (DNV) with 100% UT inspection on the seabed-facing
          weld toes during pre-installation NDT.

      - id: ve-knw-002
        title: "IEC 61400-3-2 Floating Offshore Turbines — key deltas"
        metadata: { standard: "IEC-61400-3-2", topic: "floating" }
        content: |
          IEC 61400-3-2 — FLOATING OFFSHORE WIND TURBINE STRUCTURES
          (RELATIVE TO 61400-3 BASE)

          §6.4 Mooring system. The mooring system shall be designed
          to limit horizontal offset under DLC 1.6 (operating with
          1-year extreme wave) to no more than 10% of water depth.
          Single-line failure (DLC 7.1c) shall not result in offset
          exceeding 15% nor in turbine controller switching out of
          power-production mode within the 6-hour redundancy window.

          §6.5 Stability. Intact stability shall meet IMO MODU
          intact criteria; damaged stability shall recover positive
          righting arm within 60° heel under any single watertight
          compartment flooding.

          §6.6 Mean-tilt allowance. The turbine controller shall
          tolerate continuous mean tilt up to 5° without curtailment;
          peak tilt up to 10° without trip.

          §6.8 Pendulum modes. The natural periods of surge, sway,
          heave, roll, pitch, yaw shall be outside the 5–15 s
          first-order wave excitation band by at least 20%. Coupled
          aero-hydro-servo-elastic analysis is mandatory.

          NOTE for VE engineers: spar platforms tolerate deeper
          water (>200 m) but require deep-water tow channels and
          load-out yards; semi-submersibles install in shallower
          assembly basins (15-20 m) but carry ~12% higher steel
          weight per MW than spars.

      - id: ve-knw-003
        title: "NEC 690 — Cable & Wiring Methods (offshore-wind application)"
        metadata: { standard: "NEC-690", topic: "electrical" }
        content: |
          NEC ARTICLE 690 — APPLIED TO OFFSHORE WIND BY ANALOGY

          NEC 690 is written for photovoltaic systems; in
          jurisdictions without a dedicated offshore-wind code
          (notably US-Atlantic federal waters under BOEM), the
          electrical authority of jurisdiction (AHJ) commonly
          requires offshore-wind feeder design to comply with the
          690 cable derating, grounding, and disconnect rules
          where they translate sensibly.

          §690.8 Ampacity. Conductor ampacity shall be calculated
          at the higher of:
            (a) 125% of the calculated continuous current, OR
            (b) the maximum current after applying the temperature
                and conduit-fill correction factors of Table 310.15.
          For 66 kV submarine three-core cables the buried-depth
          correction factor is 0.92 at 1.5 m burial; below 1.0 m
          burial a separate site-specific thermal CFD is required.

          §690.31(C) Wiring methods on the installation. Cables
          run on a fixed offshore substation jacket structure shall
          be supported at intervals not exceeding 1.0 m for
          conductors smaller than 1000 kcmil and 1.5 m for larger.
          Cable trays shall be hot-dip galvanised or 316L stainless
          per the marine-corrosivity category C5-M of ISO 12944.

          §690.43(D) Equipment grounding. Every metallic structural
          element of an offshore wind tower (transition piece, tower
          shells, nacelle, hub) shall be bonded to a single common
          ground bus, which in turn bonds to the seawater electrode
          via a dedicated copper or aluminium-bronze rod of minimum
          50 mm² CSA.

          §690.64 Point of common coupling. Where the offshore
          substation interconnects to onshore transmission, the PCC
          relay scheme shall comply with IEEE 1547 §4.10
          interoperability and §5 ride-through.

      - id: ve-knw-004
        title: "IEEE 1547-2018 — Interconnection Requirements (extract)"
        metadata: { standard: "IEEE-1547", topic: "grid" }
        content: |
          IEEE 1547-2018 — STANDARD FOR INTERCONNECTION AND
          INTEROPERABILITY OF DISTRIBUTED ENERGY RESOURCES

          §4.2 Reactive power capability. Category B DER (which
          covers offshore wind ≥ 25 MW) shall provide injection
          and absorption capability of at least 0.44 pu kVAr at
          rated kW output, throughout the 0.95 lag to 0.95 lead
          power factor envelope, at the reference point of
          applicability (RPA).

          §5.1 Voltage ride-through. Category III DER shall remain
          connected during voltage excursions per the trip-vs-ride
          curve in Figure H.5: ≥ 1.10 pu for 12 s; 0.88-0.90 pu
          continuously; 0.50-0.88 pu for at least 21 s; 0.30 pu
          for 0.32 s; below 0.30 pu may trip.

          §5.2 Frequency ride-through. The DER shall remain
          connected for frequency excursions of 57.0–61.8 Hz on
          a 60 Hz system per Figure H.7.

          §5.3 Frequency-watt response. A droop response with
          gradient 5% (default) shall be enabled; the system
          operator may direct values from 3% to 10%.

          §10.4 Black-start capability. Optional, but where
          enabled the DER shall be capable of energising the
          designated network section within 90 minutes of dispatch
          and supporting cold-load pickup of at least 30% of
          nameplate without trip.

      - id: ve-knw-005
        title: "RWE-EPC-S-001 — Offshore Wind EPC Tenant Standard (synth.)"
        metadata: { standard: "RWE-EPC-S-001", topic: "epc" }
        content: |
          RWE-EPC-S-001 (REV 4.2) — TENANT STANDARD FOR OFFSHORE
          WIND EPC PACKAGES — KEY CLAUSES

          §3.4 Turbine spacing. Minimum spacing in the prevailing
          wind direction shall be 7.0 rotor diameters (D); minimum
          cross-wind spacing shall be 5.0 D. Wake-loss CFD studies
          may justify a relaxation to 6.0 D / 4.5 D only when the
          combined annual energy production loss across the array
          is documented to remain below 8.5%.

          §3.7 Foundation standardisation. For arrays of 12 or
          more turbines on a single soil regime, no more than two
          foundation design variants are permitted; the additional
          steel weight from over-engineering the lighter variant
          to share fabrication tooling is accepted as the trade-off.

          §4.2 Array voltage. New designs shall standardise on
          66 kV array cables. 33 kV array systems are permitted
          only on refurbishments or when integrating with an
          existing 33 kV offshore substation.

          §4.5 Offshore substations. One offshore substation
          per 600 MW of installed capacity, with the following
          exceptions: (a) projects under 400 MW may use a single
          OSS or direct-to-shore export at 66 kV with owner
          approval; (b) projects above 1.2 GW shall be split into
          two electrical zones with cross-zone redundancy.

          §5.1 Owner's Engineer authority. The Owner's Engineer
          shall issue all RFIs through the document control system
          using a sequential RFI-YYYY-NNNN identifier. Response
          deadlines: BLOCKER = 5 business days, MAJOR = 10 BD,
          MINOR = 15 BD. Late responses trigger LD per Schedule 8.

          §6.3 Health, safety and environment. All vessel
          operations shall comply with the G+ Global Offshore Wind
          Health & Safety Organisation guidelines current as of
          contract effective date, including walk-to-work transfer
          protocols and SIMOPS exclusion zones.

      - id: ve-knw-006
        title: "Offshore Wind CapEx & LCOE 2026 Benchmarks"
        metadata: { topic: "cost", region: "global" }
        content: |
          OFFSHORE WIND CAPEX / LCOE — 2026 BENCHMARKS

          Reference benchmarks compiled from BloombergNEF, IRENA,
          and project FID announcements through Q1 2026. Use these
          for sanity-check ranges; project-specific factors swing
          ± 15% routinely.

          CapEx per installed MW (USD M):
            Shallow-water monopile (≤ 30 m):       2.6 – 3.1
            Transitional jacket (30 – 60 m):       3.2 – 3.7
            Floating semi-submersible (≥ 60 m):    4.0 – 4.5
            Floating spar:                          4.4 – 4.9
            HVDC export adder (per MW, ≥ 80 km):   +0.45 – +0.70

          LCOE 2026 (USD/MWh, post-CfD strike comparable):
            UK Round 5 monopile sites:             58 – 72
            German North Sea jackets:               68 – 84
            US East Coast monopile (BOEM lease):   78 – 95
            Asian floating (Korea, Japan):          95 – 120

          Annual O&M as % of CapEx:
            Monopile/Jacket: 4.2 – 5.5 %/y
            Floating:        5.8 – 7.0 %/y

          Lifecycle CO2 (kt CO2e per 100 MW, manufacture
          + install + decom, excluding operation):
            Monopile shallow:  140 – 170
            Jacket transitional: 170 – 210
            Floating semisub:    210 – 260

      - id: ve-knw-007
        title: "Wake Modelling Quick Reference (Jensen / Bastankhah)"
        metadata: { topic: "yield", standard: "internal" }
        content: |
          WAKE MODELLING QUICK REFERENCE

          Two engineering models are accepted at FEED gate:

          1. Jensen / Park (top-hat). Wake deficit at distance x
             behind rotor:
                u(x) / u0 = 1 − (1 − √(1 − Ct)) × (D / (D + 2kx))²
             where k is the wake decay constant: 0.075 onshore,
             0.04–0.05 offshore. Quick to evaluate, conservatively
             over-predicts deep-array losses by ~3–5% vs. Bastankhah.

          2. Bastankhah-Porté-Agel (Gaussian). Smooth radial
             velocity profile, calibrated on LES; preferred for
             arrays with non-aligned rows and for waked yield used
             in financial-close documents.

          Typical full-array yield losses on a 100-turbine
          regular grid at 7D × 5D spacing: 8 – 12 %.
          Reduce one stage of spacing → loss creeps to 14 – 18 %.

      - id: ve-knw-008
        title: "BOEM / DNV Permitting Touch-points (US Federal Waters)"
        metadata: { topic: "permitting", region: "US" }
        content: |
          BOEM + DNV PERMITTING TOUCH-POINTS

          Bureau of Ocean Energy Management (BOEM) lease lifecycle:
            1. Lease auction → Site Assessment Plan (SAP) — 1 yr
            2. Construction & Operations Plan (COP) — 2-3 yrs review
            3. Facility Design Report (FDR) + Fabrication & Install
               Report (FIR) — 6-12 months pre-construction
            4. Notice to Proceed → operation → decom bond.

          DNV-OS-J101 / DNV-ST-0119 (floating) sit alongside IEC
          61400-3 series; the AHJ typically defers to whichever is
          cited in the project Basis of Design as long as a single
          coherent code basis is documented.

          Critical-path RFIs in 2026 BOEM reviews focus on:
            (a) marine-mammal mitigation during pile-driving
                (NOAA NMFS take limits);
            (b) fishing-industry compatibility (turbine spacing
                and cable-corridor depth);
            (c) Jones Act compliance for installation vessels.

