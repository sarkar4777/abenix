<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="ciq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="ciq-glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="24" cy="24" r="23" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
  <circle cx="24" cy="22" r="14" fill="url(#ciq-glow)"/>

  <!-- Document shape -->
  <rect x="13" y="10" width="22" height="28" rx="2" fill="none" stroke="url(#ciq-grad)" stroke-width="1.5" opacity="0.9"/>
  <!-- Folded corner -->
  <path d="M29 10 L35 16 L29 16 Z" fill="#0F172A" stroke="url(#ciq-grad)" stroke-width="1"/>
  <!-- Page fold line -->
  <line x1="29" y1="10" x2="29" y2="16" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>
  <line x1="29" y1="16" x2="35" y2="16" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>

  <!-- Text lines (contract clauses) -->
  <line x1="17" y1="20" x2="31" y2="20" stroke="#10B981" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
  <line x1="17" y1="24" x2="28" y2="24" stroke="#06B6D4" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="17" y1="28" x2="30" y2="28" stroke="#10B981" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="25" y2="32" stroke="#06B6D4" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>

  <!-- Magnifying glass overlay -->
  <circle cx="32" cy="32" r="7" fill="#0F172A" stroke="url(#ciq-grad)" stroke-width="1.5" opacity="0.95"/>
  <circle cx="32" cy="32" r="4" fill="none" stroke="#10B981" stroke-width="1" opacity="0.8"/>
  <!-- Glass handle -->
  <line x1="36" y1="36" x2="40" y2="40" stroke="url(#ciq-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Checkmark inside glass -->
  <path d="M30 32 L31.5 33.5 L34 30.5" fill="none" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small accent dots -->
  <circle cx="15" cy="14" r="0.8" fill="#F59E0B" opacity="0.6"/>
  <circle cx="33" cy="12" r="0.6" fill="#F59E0B" opacity="0.5"/>
</svg>
