name: shap_explainer
description: >-
  Per-prediction explainability for the ContractIQ ML models. Given
  (model_name, feature_vector) it loads the matching .pkl from the
  platform's ML-model store, computes SHAP values (tree-shap or
  linear-shap), and returns ordered per-feature contributions + a
  cumulative waterfall. Falls back to permutation importance /
  linear coefficients when the SHAP backend can't handle the
  estimator. The Analyst Workbench page calls this so the bar chart
  shows real attributions instead of raw feature magnitudes.

input_schema:
  type: object
  required: [model_name, feature_vector]
  properties:
    model_name:
      type: string
      description: "Registered ML-model slug, e.g. price_fairvalue_gas_hubs."
    feature_vector:
      type: object
      description: "Map of feature_column -> numeric value."
      additionalProperties: { type: number }

output_schema:
  type: object
  properties:
    ok:        { type: boolean }
    method:    { type: string, description: "tree-shap | linear-shap | permutation-importance | linear-coef" }
    model_name: { type: string }
    prediction: { type: number }
    feature_columns:
      type: array
      items: { type: string }
    contributions:
      type: array
      items:
        type: object
        properties:
          feature: { type: string }
          value:   { type: number }
    waterfall:
      type: array
      items:
        type: object
        properties:
          feature: { type: string }
          delta:   { type: number }
    error:     { type: string }

example_input:
  model_name: price_fairvalue_gas_hubs
  feature_vector:
    storage_eu_pct: 62
    ttf_basis_eur: 0.4
    hh_eur_equiv: 13.2
    brent_eur: 78
    weather_anomaly_c: 0.5
    lng_send_out_gwh: 2900
