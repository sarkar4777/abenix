# ContractIQ — Kubernetes manifests (standalone application)
#
# Deploys ContractIQ API (port 8001) and Web (port 3001) into the same
# namespace as Abenix so they can share PostgreSQL and reach Abenix
# via the cluster DNS.

---
apiVersion: v1
kind: Secret
metadata:
  name: contractiq-secrets
  namespace: abenix
type: Opaque
stringData:
  CONTRACTIQ_ABENIX_API_KEY: "REPLACE_AT_DEPLOY_TIME"
  CONTRACTIQ_JWT_SECRET: "REPLACE_AT_DEPLOY_TIME"
  ANTHROPIC_API_KEY: "REPLACE_AT_DEPLOY_TIME"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contractiq-config
  namespace: abenix
data:
  ABENIX_API_URL: "http://abenix-api:8000"
  DATABASE_URL: "postgresql+asyncpg://postgres:localpass@abenix-postgresql:5432/abenix"
  PORT: "8001"
  # Namespace the progress stream so contractiq runs alongside wingman
  # without channel collisions. Must match what the agent-runtime pod
  # publishes — when contractiq triggers agents through the platform we
  # rely on the abenix configmap's PROGRESS_CHANNEL_PREFIX override.
  PROGRESS_CHANNEL_PREFIX: "contractiq:progress:"
  PROGRESS_PARENT_KEY_PREFIX: "contractiq:parent:"
  PROGRESS_PARENT_TTL: "1800"
  # Tell the agent-runtime to load contractiq's deterministic guardrails.
  # The runtime imports each listed module at startup, which triggers the
  # canonical-anchor registry to register itself with engine.post_processors.
  POST_PROCESSOR_MODULES: "contractiq.runtime.post_processors"
  # Domain-keyword overrides for sentiment_analyzer: e&c / energy-desk terms
  # (ppa, tolling, take_or_pay) that should not live in the generic engine.
  SENTIMENT_LEXICON_OVERRIDE_PATH: "/app/contractiq/runtime/sentiment_lexicon_override.json"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractiq-api
  namespace: abenix
  labels:
    app: contractiq-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contractiq-api
  template:
    metadata:
      labels:
        app: contractiq-api
    spec:
      containers:
        - name: api
          image: localhost:5000/abenix/contractiq-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - secretRef:
                name: contractiq-secrets
            - configMapRef:
                name: contractiq-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1.5Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: contractiq-api
  namespace: abenix
spec:
  type: ClusterIP
  selector:
    app: contractiq-api
  ports:
    - name: http
      port: 8001
      targetPort: 8001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractiq-web
  namespace: abenix
  labels:
    app: contractiq-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contractiq-web
  template:
    metadata:
      labels:
        app: contractiq-web
    spec:
      containers:
        - name: web
          image: localhost:5000/abenix/contractiq-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            # Server-side rewrite target. next.config.js reads this and
            # proxies /api/contractiq/* requests to the cluster-internal
            # contractiq-api service. The browser uses relative URLs
            # (NEXT_PUBLIC_API_URL is intentionally empty in the build).
            - name: CONTRACTIQ_API_INTERNAL_URL
              value: "http://contractiq-api:8001"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: contractiq-web
  namespace: abenix
spec:
  type: NodePort
  selector:
    app: contractiq-web
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30301
